          Tidak resmi, bukan dari Duolingo. Audio memakai suara bawaan browser (Text-to-Speech). Bagian berbicara ditranskrip otomatis melalui Web Speech API lalu dinilai oleh AI Gemini bersama bagian tulisan. Progres tersimpan otomatis.
        </p>
      `;

      $("#btnFullStart").onclick = () => fullTest();
      $("#btnProgressCard").onclick = () => progress();
      appEl.querySelectorAll(".tab").forEach((el) => {
        el.onclick = () => {
          tab = el.dataset.tab;
          home();
        };
      });
      appEl.querySelectorAll("[data-skill]").forEach((el) => {
        el.onclick = () => skill(el.dataset.skill);
      });
    }

    function skill(k) {
      VIEW = "skill";
      stop();
      $("#prog").style.visibility = "hidden";
      const s = SK.find((x) => x.k === k);
      const P = store.get()[k] || [];
      const tot = totalPackets(k);

      appEl.innerHTML = `
        <span class="back" id="btnBackHome">← Kembali</span>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px">
          <div>
            <h1 style="margin-bottom:6px">${s.ic} ${s.n}</h1>
            <p class="sub" style="margin-bottom:0">${INFO[k]}</p>
          </div>
          <button class="btn sec" id="btnGenAI" style="flex-shrink:0">✨ Buat Paket Akademik Baru (AI)</button>
        </div>

        <div class="sets" style="margin-top:16px">
          ${Array.from({ length: tot }, (_, i) => {
            const val = P[i];
            const isAI = i >= BASE_NP;
            return `
              <div class="set ${val != null ? "done" : ""} ${isAI && val == null ? "ai-set" : ""}" data-idx="${i}">
                Paket ${i + 1} ${isAI ? "✨" : ""}
                <small>${val == null ? "Belum dikerjakan" : val < 0 ? "✓ Selesai" : "✓ Skor " + val}</small>
              </div>`;
          }).join("")}
        </div>
      `;

      $("#btnBackHome").onclick = () => home();
      $("#btnGenAI").onclick = () => generateNewAIPacket(k);
      appEl.querySelectorAll(".set").forEach((el) => {
        el.onclick = () => practice(k, Number(el.dataset.idx));
      });
    }

    // =========================================================================
    // 8. ENGINE TAMPILAN SOAL & SEMUA 13 TIPE SOAL DET
    // =========================================================================
    function screen(tag, h, body, btn = "Submit", sub = "") {
      appEl.innerHTML = `
        <div class="qcard">
          <div class="qhead">
            <span>⏱ <b id="qt">–</b> <span id="ql" class="note"></span></span>
            <span class="tag" style="margin:0">${tag}</span>
            <span class="qx" id="btnQuitQ" title="Keluar">✕</span>
          </div>
          <div class="qbody">
            ${h ? `<h2 style="text-align:center">${h}</h2>` : ""}
            ${sub ? `<p class="sub" style="text-align:center">${sub}</p>` : ""}
            ${body}
          </div>
          <div class="qfoot">
            <span class="note" id="wcn" style="font-weight:700"></span>
            <button class="btn" id="nx">${btn}</button>
          </div>
        </div>
      `;
      $("#btnQuitQ").onclick = () => quitQ();
    }

    function quitQ() {
      const b = $("#btnQuitQ");
      if (!b) return;
      if (b.dataset.c) {
        stop();
        home();
      } else {
        b.dataset.c = "1";
        b.textContent = "Keluar? klik lagi";
        b.style.color = "var(--r)";
        setTimeout(() => {
          if (b.isConnected) {
            b.dataset.c = "";
            b.textContent = "✕";
            b.style.color = "";
          }
        }, 3000);
      }
    }

    function bindWC() {
      const t = $("#tx");
      if (!t) return;
      const update = () => {
        const el = $("#wcn");
        if (el) el.textContent = wc(t.value) + " kata";
      };
      t.oninput = update;
      update();
      t.focus();
    }

    // Kotak 1 huruf per karakter (.lb) dengan navigasi keyboard penuh
    function boxes(n, attr) {
      return `<span class="lb" ${attr}>${Array.from({ length: n }, () => `<input type="text" maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" />`).join("")}</span>`;
    }

    function lbVal(el) {
      return el ? [...el.querySelectorAll("input")].map((i) => i.value).join("") : "";
    }

    function bindBoxes() {
      const all = [...appEl.querySelectorAll(".lb input")];
      all.forEach((inp, i) => {
        inp.oninput = () => {
          const v = inp.value.replace(/[^a-zA-Z]/g, "");
          inp.value = v.slice(-1);
          if (inp.value && all[i + 1]) all[i + 1].focus();
        };
        inp.onkeydown = (e) => {
          if (e.key === "Backspace" && !inp.value && all[i - 1]) {
            all[i - 1].focus();
            all[i - 1].value = "";
            e.preventDefault();
          } else if (e.key === "ArrowLeft" && all[i - 1]) {
            all[i - 1].focus();
            e.preventDefault();
          } else if (e.key === "ArrowRight" && all[i + 1]) {
            all[i + 1].focus();
            e.preventDefault();
          }
        };
      });
      if (all[0]) all[0].focus();
    }

    // Layar persiapan 20 detik
    function intro(k, x, go) {
      const [n, h, s] = INTRO[k];
      const topic = k === "ws" ? esc(x) : k === "iw" ? esc(x[0]) : k === "il" ? esc(x.ctx) : "";
      screen(
        n,
        h,
        `${topic ? `<div class="passage" style="max-width:540px;margin:12px auto">${topic}</div>` : ""}
         ${k === "is" ? `<div style="font-size:74px;text-align:center;margin:10px 0">🧑‍🏫</div>` : ""}
         <p class="note" style="text-align:center;margin-top:20px">Soal dimulai otomatis saat waktu habis, atau klik <b>Mulai</b> jika sudah siap.</p>`,
        "Mulai",
        s
      );
      const f = once(() => {
        clearInterval(tmr);
        document.onkeydown = null;
        go();
      });
      $("#nx").onclick = f;
      document.onkeydown = (e) => {
        if (e.key === "Enter") f();
      };
      timer(20, f, "to start");
    }

    function run(k, x, done0) {
      stop();
      const done = (r) => {
        r.k = k;
        grade(k, x, r, done0);
      };
      if (["sp", "rts", "ss"].includes(k)) return runCore(k, x, done);
      intro(k, x, () => runCore(k, x, done));
    }

    function runCore(k, x, done) {
      const N = SK.find((s) => s.k === k).n;

      // 1. Read and Select
      if (k === "rs") {
        let j = 0, c = 0, log = [];
        const step = () => {
          const w = x.words[j];
          const isR = x.real.includes(w);
          screen(
            `${N} · ${j + 1}/${x.words.length}`,
            "Is this a real English word?",
            `<div style="text-align:center;font-size:44px;font-weight:900;padding:28px 0;letter-spacing:0.5px">${esc(w)}</div>
             <div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap">
               <button class="yn" id="ya"><span style="color:var(--b);font-size:38px;line-height:1">✔</span>Yes</button>
               <button class="yn" id="no"><span style="color:var(--b);font-size:38px;line-height:1">✖</span>No</button>
             </div>
             <p class="note" style="text-align:center;margin-top:16px">Keyboard: <b>Y</b> = Yes, <b>N</b> = No · Tidak dijawab dalam 5 detik = salah</p>`
          );
          $("#nx").style.display = "none";
          const f = once((ans) => {
            document.onkeydown = null;
            const ok = ans === isR;
            c += ok ? 1 : 0;
            log.push(`${ok ? "✅" : "❌"} <b>${esc(w)}</b> <span class="note">(${isR ? "asli" : "palsu"}${ans == null ? ", tidak dijawab" : ""})</span>`);
            if (++j < x.words.length) step();
            else done({ n: N, sc: c, max: x.words.length, d: log.join("<br>") });
          });
          $("#ya").onclick = () => f(true);
          $("#no").onclick = () => f(false);
          document.onkeydown = (e) => {
            if (/^[yY]$/.test(e.key)) f(true);
            if (/^[nN]$/.test(e.key)) f(false);
          };
          timer(5, () => f(null), "for this question");
        };
        step();
      }

      // 2. Fill in the Blanks
      else if (k === "fb") {
        let j = 0, c = 0, log = [];
        const step = () => {
          const [s, a] = x[j];
          const pre = a.slice(0, Math.max(1, Math.ceil(a.length / 3)));
          const restLen = Math.max(1, a.length - pre.length);
          screen(
            `${N} · ${j + 1}/${x.length}`,
            "Complete the sentence with the correct word",
            `<div class="passage" style="font-size:18px;line-height:2.6;margin-top:10px">
              ${esc(s).replace("___", `<span class="lbpre">${pre.split("").map((ch) => `<i>${ch}</i>`).join("")}</span>${boxes(restLen, 'id="in"')}`)}
             </div>`
          );
          bindBoxes();
          const f = once(() => {
            const v = pre + lbVal($("#in"));
            const ok = norm(v) === norm(a);
            c += ok ? 1 : 0;
            log.push(`${ok ? "✅" : "❌"} <b>${esc(a)}</b> <span class="note">(Jawabanmu: ${esc(v)})</span>`);
            if (++j < x.length) step();
            else done({ n: N, sc: c, max: x.length, d: log.join("<br>") });
          });
          $("#nx").onclick = f;
          document.onkeydown = (e) => {
            if (e.key === "Enter") f();
          };
          timer(20, f, "for this question");
        };
        step();
      }

      // 3. Read and Complete (C-Test)
      else if (k === "ct") {
        const sent = x.p.match(/[^.!?]+[.!?]+/g) || [x.p];
        let html = esc(sent[0]) + " ";
        const ans = [];
        let q = 0;

        sent.slice(1).join(" ").trim().split(/\s+/).forEach((tok) => {
          const m = tok.match(/^([A-Za-z]+)(.*)$/);
          if (m && m[1].length > 2 && q++ % 2 === 1 && ans.length < 16) {
            const w = m[1];
            const h = Math.floor(w.length / 2);
            ans.push(w.slice(h).toLowerCase());
            html += `<span class="lbpre">${w.slice(0, h).split("").map((ch) => `<i>${ch}</i>`).join("")}</span>${boxes(w.length - h, `data-i="${ans.length - 1}"`)}${esc(m[2])} `;
          } else {
            html += esc(tok) + " ";
          }
        });

        screen(
          N,
          "Complete the text with the correct words",
          `<p style="text-align:center;font-weight:900;font-size:17px;margin:4px 0 12px">${esc(x.t)}</p>
           <div class="passage ctest">${html}</div>`
        );
        bindBoxes();

        const f = once(() => {
          let c = 0;
          const miss = [];
          appEl.querySelectorAll(".ctest .lb").forEach((e) => {
            const expected = ans[Number(e.dataset.i)];
            const typed = lbVal(e).trim().toLowerCase();
            if (typed === expected) c++;
            else miss.push(`<b>${esc(expected)}</b> (kamu: ${esc(typed || "–")})`);
          });
          done({
            n: N,
            sc: c,
            max: ans.length,
            d: miss.length ? "Bagian yang belum tepat:<br>" + miss.join(", ") : "Sempurna! Semua kata benar."
          });
        });
        $("#nx").onclick = f;
        timer(180, f, "for this question");
      }

      // 4. Interactive Reading (2 kolom, 6 dropdown POS-identik + judul terbaik)
      else if (k === "ir") {
        const nb = x.b.length;
        const pHtml = esc(x.p).replace(/\{(\d+)\}/g, (_, n) => `<span class="blank" id="bk${n}"><b>${+n + 1}</b><span></span></span>`);
        const oo = shuffle(x.o.map((o, j) => [o, j]), rng(x.p.length + 5));

        screen(
          N,
          "Select the best option for each missing word",
          `<div class="two">
             <div class="passage" style="max-height:450px;overflow-y:auto">
               <p class="note" style="margin:0 0 8px;font-weight:900;letter-spacing:0.6px">PASSAGE</p>
               ${pHtml}
             </div>
             <div>
               ${x.b
                 .map((b, n) => {
                   const sorted = b.map((w, j) => [w, j]).sort((a, c) => a[0].localeCompare(c[0]));
                   return `
                     <div class="sel">
                       <span class="num">${n + 1}</span>
                       <select data-i="${n}">
                         <option value="">Select a word</option>
                         ${sorted.map(([w, j]) => `<option value="${j}">${esc(w)}</option>`).join("")}
                       </select>
                     </div>`;
                 })
                 .join("")}
               <p style="margin:18px 0 8px;font-weight:800">${nb + 1}. ${esc(x.q)}</p>
               ${oo.map(([o, j]) => `<label class="opt" data-j="${j}">${esc(o)}</label>`).join("")}
             </div>
           </div>`,
          "Submit",
          `${nb + 1} questions`
        );

        appEl.querySelectorAll("select").forEach((sel) => {
          sel.onchange = () => {
            const bk = $("#bk" + sel.dataset.i);
            const sp = bk ? bk.querySelector("span") : null;
            if (sp) sp.textContent = sel.value === "" ? "" : sel.options[sel.selectedIndex].text;
            if (bk) bk.classList.toggle("filled", sel.value !== "");
          };
        });

        let ch = -1;
        appEl.querySelectorAll(".opt").forEach((el) => {
          el.onclick = () => {
            appEl.querySelectorAll(".opt").forEach((z) => z.classList.remove("on"));
            el.classList.add("on");
            ch = Number(el.dataset.j);
          };
        });

        const f = once(() => {
          let c = 0;
          const breakdown = [];
          appEl.querySelectorAll("select").forEach((sel) => {
            const idx = Number(sel.dataset.i);
            const ok = sel.value === "0";
            if (ok) c++;
            const chosen = sel.value === "" ? "(kosong)" : sel.options[sel.selectedIndex].text;
            breakdown.push(`${ok ? "✅" : "❌"} [${idx + 1}] <b>${esc(x.b[idx][0])}</b> <span class="note">(pilihanmu: ${esc(chosen)})</span>`);
          });
          const titleOk = ch === 0;
          if (titleOk) c++;
          breakdown.push(`${titleOk ? "✅" : "❌"} [Judul] <b>${esc(x.o[0])}</b>`);
          done({ n: N, sc: c, max: nb + 1, d: breakdown.join("<br>") });
        });
        $("#nx").onclick = f;
        timer(480, f, `for ${nb + 1} questions`);
      }

      // 5. Listen and Type
      else if (k === "lt") {
        let j = 0, c = 0, mx = 0, log = [];
        const step = () => {
          const s = x[j];
          let plays = 0;
          screen(
            `${N} · ${j + 1}/${x.length}`,
            "Type what you hear",
            `<div style="text-align:center;margin:10px 0 18px">
               <button type="button" class="spk" id="pl" title="Putar audio">🔊</button>
               <div style="margin-top:10px"><span class="tag" id="rl" style="margin:0">REPLAYS LEFT: 2</span></div>
             </div>
             <textarea id="tx" style="min-height:95px;max-width:540px;display:block;margin:0 auto" placeholder="Your response"></textarea>`
          );
          bindWC();
          const play = () => {
            if (plays < 3) {
              plays++;
              speak(s);
              const rl = $("#rl");
              if (rl) rl.textContent = "REPLAYS LEFT: " + Math.max(0, 3 - plays);
              if (plays >= 3 && $("#pl")) {
                $("#pl").style.opacity = "0.55";
                $("#pl").style.cursor = "not-allowed";
              }
            }
          };
          $("#pl").onclick = play;
          setTimeout(play, 350);

          const f = once(() => {
            const a = norm(s).split(" ");
            const u = norm($("#tx").value).split(" ");
            let matched = 0;
            a.forEach((w, idx) => {
              if (u[idx] === w) matched++;
            });
            c += matched;
            mx += a.length;
            log.push(`<b>Kalimat ${j + 1}:</b> ${esc(s)}<br><span class="note">Ketikanmu: ${esc($("#tx").value || "(kosong)")}</span>`);
            if (++j < x.length) step();
            else done({ n: N, sc: c, max: mx, d: log.join("<br><br>") });
          });
          $("#nx").onclick = f;
          timer(60, f, "for this question");
        };
        step();
      }

      // 6. Interactive Listening (3 giliran dialog + ringkasan tertulis 75 detik)
      else if (k === "il") {
        let j = 0, c = 0, chatHist = "", log = [];
        const step = () => {
          const t = x.t[j];
          const oo = shuffle(t.o.map((o, idx) => [o, idx]));
          screen(
            `${N} · ${j + 1}/${x.t.length}`,
            "Select the best response",
            `<p class="sub" style="text-align:center">${esc(x.ctx)}</p>
             ${chatHist}
             <div class="bubble" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
               <div>🔊 <span id="said" style="filter:blur(4px);transition:filter 0.25s ease">${esc(t.s)}</span></div>
               <button type="button" class="btn sec sm" id="pl">Putar</button>
             </div>
             <div style="margin-top:12px">
               ${oo.map(([o, idx]) => `<label class="opt" data-j="${idx}">${esc(o)}</label>`).join("")}
             </div>`
          );

          setTimeout(() => speak(t.s), 300);
          $("#pl").onclick = () => {
            speak(t.s);
            const said = $("#said");
            if (said) said.style.filter = "none";
          };

          let ch = -1;
          appEl.querySelectorAll(".opt").forEach((el) => {
            el.onclick = () => {
              appEl.querySelectorAll(".opt").forEach((z) => z.classList.remove("on"));
              el.classList.add("on");
              ch = Number(el.dataset.j);
            };
          });

          const f = once(() => {
            const ok = ch === t.a;
            c += ok ? 1 : 0;
            log.push(`${ok ? "✅" : "❌"} <b>Giliran ${j + 1}:</b> ${esc(t.o[t.a])}`);
            chatHist += `<div class="bubble">${esc(t.s)}</div><div class="bubble me">${ch >= 0 ? esc(t.o[ch]) : "<i>(tidak menjawab)</i>"}</div>`;
            if (++j < x.t.length) step();
            else summ();
          });
          $("#nx").onclick = f;
          timer(60, f, "for this question");
        };

        const summ = () => {
          screen(
            `${N} · Summary`,
            "Summarize the conversation you just had",
            `<p class="sub" style="text-align:center">${esc(x.sum)}</p>
             <div style="max-height:220px;overflow-y:auto;margin-bottom:12px;padding-right:4px">${chatHist}</div>
             <textarea id="tx" style="min-height:115px" placeholder="Write a concise summary in English..."></textarea>`
          );
          bindWC();
          const f = once(() => {
            done({
              n: N,
              sc: c,
              max: x.t.length,
              txt: $("#tx").value,
              d: "<b>Balasan terbaik:</b><br>" + log.join("<br>")
            });
          });
          $("#nx").onclick = f;
          timer(75, f, "to write");
        };

        step();
      }

      // 7. Write About the Photo
      else if (k === "wp") {
        screen(
          N,
          "Write a description of the image below for 1 minute",
          `<div class="two">
             <div class="scene">
               <div class="scene-emoji">${x[0]}</div>
               <div class="scene-cap">${esc(x[1])}</div>
             </div>
             <textarea id="tx" placeholder="Describe what is happening in the scene in English..."></textarea>
           </div>`
        );
        bindWC();
        const f = once(() => done({ n: N, txt: $("#tx").value, d: "Adegan: " + esc(x[1]) }));
        $("#nx").onclick = f;
        timer(60, f, "for this question");
      }

      // 8. Writing Sample
      else if (k === "ws") {
        screen(
          N,
          "Write about the topic below for 5 minutes",
          `<div class="passage" style="max-width:600px;margin:0 auto 14px;font-weight:700">${esc(x)}</div>
           <textarea id="tx" style="max-width:600px;display:block;margin:0 auto;min-height:210px" placeholder="Write your academic response (at least 50 words)..."></textarea>`
        );
        bindWC();
        const f = once(() => done({ n: N, txt: $("#tx").value, d: esc(x) }));
        $("#nx").onclick = f;
        timer(300, f, "to write");
      }

      // 9. Interactive Writing (Tahap 1: 5 mnt, Tahap 2: 3 mnt dengan jawaban tahap 1 tetap terlihat)
      else if (k === "iw") {
        const col = (num, title, active, inner) => `
          <div style="opacity:${active ? 1 : 0.45};transition:opacity 0.25s ease">
            <h3 style="margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px">
              <span class="num">${num}</span> ${title}
            </h3>
            ${inner}
          </div>`;

        screen(
          `${N} · Part 1`,
          "",
          `<div class="two">
             ${col(1, "Write about the topic below for 5 minutes", true, `<div class="passage" style="font-size:14.5px;margin-bottom:10px">${esc(x[0])}</div><textarea id="tx" placeholder="Your response..."></textarea>`)}
             ${col(2, "Write a follow-up response for 3 minutes", false, `<div class="passage" style="font-size:14px;color:#888">Pertanyaan lanjutan akan terbuka setelah tahap 1 selesai.</div>`)}
           </div>`,
          "Continue"
        );
        bindWC();

        const f = once(() => {
          const a1 = $("#tx").value;
          screen(
            `${N} · Part 2`,
            "",
            `<div class="two">
               ${col(1, "Your initial response", false, `<p class="note" style="margin:0 0 6px">${esc(x[0])}</p><div class="passage" style="font-size:14px;white-space:pre-wrap;max-height:260px;overflow-y:auto">${esc(a1) || "<i>(kosong)</i>"}</div>`)}
               ${col(2, "Write a follow-up response for 3 minutes", true, `<div class="passage" style="font-size:14.5px;margin-bottom:10px">${esc(x[1])}</div><textarea id="tx" placeholder="Your follow-up response..."></textarea>`)}
             </div>`,
            "Submit"
          );
          bindWC();
          const g = once(() => {
            done({
              n: N,
              txt: a1 + "\n\n[Follow-up]\n" + $("#tx").value,
              d: "<b>Topik utama:</b> " + esc(x[0]) + "<br><b>Pertanyaan lanjutan:</b> " + esc(x[1])
            });
          });
          $("#nx").onclick = g;
          timer(180, g, "to write");
        });
        $("#nx").onclick = f;
        timer(300, f, "to write");
      }

      // 10. Speak About the Photo (20s prep + 90s speak)
      else if (k === "sp") {
        speakTask(
          N,
          "Prepare to speak about the image below",
          "You will have 90 seconds to speak",
          `<div class="scene" style="max-width:390px;margin:0 auto">
             <div class="scene-emoji">${x[0]}</div>
             <div class="scene-cap">${esc(x[1])}</div>
           </div>`,
          20,
          90,
          done,
          "Adegan: " + esc(x[1])
        );
      }

      // 11. Read, Then Speak (20s prep + 90s speak)
      else if (k === "rts") {
        speakTask(
          N,
          "Prepare to speak about the topic below",
          "You will have 90 seconds to speak",
          `<div class="passage" style="max-width:540px;margin:0 auto">
             <b>${esc(x[0])}</b>
             <ul class="pts">${x[1].map((pt) => `<li>${esc(pt)}</li>`).join("")}</ul>
           </div>`,
          20,
          90,
          done,
          esc(x[0])
        );
      }

      // 12. Speaking Sample (20s prep + 3 min speak)
      else if (k === "ss") {
        speakTask(
          N,
          "Prepare to speak about the topic below",
          "You will have 3 minutes to speak",
          `<div class="passage" style="max-width:560px;margin:0 auto;font-weight:700">${esc(x)}</div>`,
          20,
          180,
          done,
          esc(x)
        );
      }

      // 13. Interactive Speaking (3 pertanyaan audio berurutan, 35 detik jawab per pertanyaan)
      else if (k === "is") {
        let j = 0, totSec = 0, trs = [];
        const Q = x[1].slice(0, 3);
        const step = () => {
          const q = Q[j];
          let ts = 0;
          screen(
            `${N} · ${j + 1}/${Q.length}`,
            "Listen to the question",
            `<div style="text-align:center">
               <div class="tag" style="background:#f3f4f6;color:#4b5563">Tema: ${esc(x[0])}</div>
               <div style="font-size:68px;margin:6px 0">🧑‍🏫</div>
               <button type="button" class="btn sec sm" id="pl">🔊 Putar ulang pertanyaan</button>
               <p class="note" style="margin-top:10px"><span id="said" style="filter:blur(4px);transition:filter 0.25s ease">${esc(q)}</span></p>
             </div>
             <p class="sub" id="ph" style="text-align:center;margin-top:12px">Dengarkan pertanyaan. Klik <b>Mulai jawab</b> atau rekaman otomatis dimulai saat waktu dengar habis.</p>
             ${TRBOX}`,
            "🎙️ Mulai jawab"
          );

          setTimeout(() => speak(q), 300);
          $("#pl").onclick = () => {
            speak(q);
            const said = $("#said");
            if (said) said.style.filter = "none";
          };

          const finishTurn = once(async () => {
            clearInterval(tmr);
            $("#nx").disabled = true;
            trs.push(await getTranscript());
            totSec += ts ? (Date.now() - ts) / 1000 : 0;
            if (++j < Q.length) step();
            else {
              done({
                n: N,
                d: Q.map((qq, idx) => `<b>Q${idx + 1}:</b> ${esc(qq)}`).join("<br>"),
                secs: Math.round(totSec),
                tr: Q.map((qq, idx) => `Q${idx + 1}: ${qq}\nA: ${trs[idx] || "(no answer)"}`).join("\n\n")
              });
            }
          });

          const startAnswer = once(() => {
            ts = Date.now();
            try { window.speechSynthesis.cancel(); } catch (e) {}
            recBegin();
            const h2 = appEl.querySelector(".qbody h2");
            if (h2) h2.textContent = "Speak your response";
            const ph = $("#ph");
            if (ph) ph.innerHTML = "🎙️ <b>Jawab sekarang!</b> (35 detik)";
            $("#nx").textContent = j < Q.length - 1 ? "Pertanyaan berikutnya" : "Submit";
            $("#nx").onclick = finishTurn;
            timer(35, finishTurn, "to speak");
          });

          $("#nx").onclick = startAnswer;
          timer(Math.max(5, Math.ceil(q.length / 13) + 3), startAnswer, "to listen");
        };
        step();
      }
    }

    function speakTask(N, h, sub, body, prep, sec, done, d) {
      screen(
        N,
        h,
        `${body}
         <p class="sub" id="ph" style="margin-top:14px;text-align:center">Persiapan ${prep} detik. Rekaman mulai otomatis saat waktu habis, atau klik <b>Click to record</b>.</p>
         ${TRBOX}`,
        "🎙️ Click to record",
        sub
      );

      let t0 = 0;
      const fin = once(async () => {
        clearInterval(tmr);
        $("#nx").disabled = true;
        const ph = $("#ph");
        if (ph) ph.textContent = "Menyelesaikan transkrip...";
        const tr = await getTranscript();
        done({ n: N, d, secs: t0 ? Math.round((Date.now() - t0) / 1000) : 0, tr });
      });

      const go = once(() => {
        t0 = Date.now();
        recBegin();
        const h2 = appEl.querySelector(".qbody h2");
        if (h2) h2.textContent = h.replace("Prepare to speak", "Speak");
        const ph = $("#ph");
        if (ph) ph.innerHTML = "🎙️ <b>Bicara sekarang!</b>";
        $("#nx").textContent = "Submit";
        $("#nx").onclick = fin;
        timer(sec, fin, "to speak");
      });

      $("#nx").onclick = go;
      timer(prep, go, "to prepare");
    }

    // =========================================================================
    // 9. PENILAIAN AI GEMINI + FALLBACK RUBRIK LOKAL
    // =========================================================================
    const LINK = [
      "because","however","therefore","although","moreover","furthermore","for example","for instance",
      "in addition","on the other hand","as a result","in conclusion","first","second","finally",
      "while","whereas","since","so that","which","who","if","unless","despite","also","besides",
      "overall","in my opinion","i believe","consequently","nevertheless","nonetheless"
    ];
    const STOP = "the a an and or but of to in on at for with is are was were be been it this that these those you your i we they he she his her their our as by from about what why how do does did should would could can will not no yes there have has had more most some any each".split(" ");
    const MINW = { wp: 15, il: 25, ws: 55, iw: 70, sp: 45, rts: 65, ss: 110, is: 55 };

    function taskText(k, x) {
      if (k === "wp") return `Write About the Photo (1 minute). Scene: ${x[1]} [${x[0]}]`;
      if (k === "ws") return `Writing Sample (5 minutes, 50+ words): ${x}`;
      if (k === "iw") return `Interactive Writing. Part 1 (5 min): ${x[0]} | Part 2 Follow-up (3 min): ${x[1]}`;
      if (k === "il") return `Summarize the Conversation (75 seconds). Context: ${x.ctx}. Dialog: ${x.t.map((t) => "Other: " + t.s + " / Student: " + t.o[0]).join(" ")}`;
      if (k === "sp") return `Speak About the Photo (90 seconds). Scene: ${x[1]} [${x[0]}]`;
      if (k === "rts") return `Read, Then Speak (90 seconds): ${x[0]} Points: ${x[1].join(" ")}`;
      if (k === "ss") return `Speaking Sample (3 minutes): ${x}`;
      if (k === "is") return `Interactive Speaking (${x[0]}): 3 spoken questions, 35s each.`;
      return "";
    }

    function gradeLocal(k, ans, prompt, secs) {
      const sp = SPK.includes(k);
      const words = (ans.toLowerCase().match(/[a-z']+/g) || []);
      const n = words.length;
      const min = MINW[k] || 40;
      const fb = [];
      let p = {};

      if (n < 3) {
        return {
          score: 10,
          cefr: "A1",
          rule: `<p class="no">Jawaban kosong atau terlalu pendek (${n} kata).</p>`,
          tips: [sp ? "Pastikan mikrofon aktif dan bicara minimal 30 detik secara jelas." : "Tulis kalimat lengkap bahasa Inggris sesuai instruksi."],
          src: "rule"
        };
      }

      p.len = n >= min ? 3 : n >= min * 0.7 ? 2 : n >= min * 0.4 ? 1 : 0;
      fb.push(`Panjang: ${n} kata (target ≥${min})`);

      const uniq = new Set(words).size;
      const ttr = n ? uniq / n : 0;
      const longW = words.filter((w) => w.length >= 7).length;
      p.voc = (n >= 10 && ttr >= 0.5 ? 1 : 0) + (n && longW / n >= 0.12 ? 1 : 0);
      fb.push(`Variasi kosakata ${Math.round(ttr * 100)}%, kata akademik/panjang: ${longW}`);

      if (sp) {
        const wpm = secs > 0 ? Math.round(n / (secs / 60)) : 0;
        const goodDur = secs >= 25 ? 1 : 0;
        const goodPace = wpm >= 75 && wpm <= 170 ? 1 : 0;
        p.gram = goodDur + goodPace;
        fb.push(`Durasi: ${secs || 0} dtk${wpm ? `, kecepatan ~${wpm} kata/menit` : ""}`);
      } else {
        const sents = ans.split(/(?<=[.!?])\s+/).map((z) => z.trim()).filter((z) => z.length > 1);
        const goodS = sents.filter((z) => /^[A-Z"']/.test(z) && /[.!?]["']?$/.test(z)).length;
        const avg = sents.length ? n / sents.length : 0;
        p.gram = (sents.length && goodS / sents.length >= 0.8 && !/\bi\b/.test(ans) ? 1 : 0) + (avg >= 8 && avg <= 28 ? 1 : 0);
        fb.push(`${sents.length} kalimat, rata-rata ${Math.round(avg)} kata/kalimat`);
      }

      const lc = " " + words.join(" ") + " ";
      const links = LINK.filter((l) => lc.includes(" " + l + " "));
      p.coh = links.length >= 4 ? 2 : links.length >= 2 ? 1 : 0;
      fb.push(`Penghubung: ${links.length ? links.slice(0, 6).join(", ") : "belum ada"}`);

      const kw = [...new Set((prompt.toLowerCase().match(/[a-z]{4,}/g) || []).filter((w) => !STOP.includes(w)))];
      const hit = kw.filter((w) => words.some((x) => x.startsWith(w.slice(0, 5))));
      p.rel = k === "wp" || k === "sp" ? (n >= 10 ? 1 : 0) : (hit.length >= Math.min(2, kw.length) ? 1 : 0);

      const sc = p.len + p.voc + p.gram + p.coh + p.rel;
      const bnd = band(sc / 10);
      const tips = [];
      if (p.len < 3) tips.push(sp ? "bicara lebih panjang dan kembangkan detail" : "perpanjang jawaban sesuai target kata");
      if (p.voc < 2) tips.push("gunakan kosakata akademik yang lebih beragam");
      if (p.gram < 2) tips.push(sp ? "jaga tempo bicara yang stabil dan minimal 30 detik" : "perhatikan huruf kapital, tanda baca, dan variasi struktur kalimat");
      if (p.coh < 2) tips.push("tambahkan kata penghubung (however, moreover, for example, consequently)");
      if (!p.rel) tips.push("pastikan langsung menjawab pertanyaan utama");

      return {
        score: bnd,
        cefr: lvl(bnd),
        rule: `
          <table>
            <tr><td>Panjang & kelengkapan</td><td><b>${p.len}/3</b></td></tr>
            <tr><td>Kosakata akademik</td><td><b>${p.voc}/2</b></td></tr>
            <tr><td>${sp ? "Kelancaran & durasi (WPM)" : "Tata bahasa & mekanik"}</td><td><b>${p.gram}/2</b></td></tr>
            <tr><td>Koherensi & penghubung</td><td><b>${p.coh}/2</b></td></tr>
            <tr><td>Relevansi topik</td><td><b>${p.rel}/1</b></td></tr>
          </table>
          <p class="note" style="margin-top:8px">${fb.join(" · ")}</p>
          ${tips.length ? `<p style="margin-top:8px"><b>Saran:</b> ${tips.join("; ")}.</p>` : `<p class="ok" style="margin-top:8px">Sangat baik!</p>`}`,
        src: "rule"
      };
    }

    async function aiGrade(k, x, ans, secs) {
      const sp = SPK.includes(k);
      const n = wc(ans || "");
      if (n < 3) return gradeLocal(k, ans || "", taskText(k, x), secs);

      const wpm = secs ? Math.round(n / (secs / 60)) : null;
      const metricKey = sp ? "fluency" : "mechanics";

      const prompt = `You are a certified Duolingo English Test (DET) rater. Grade ONE ${sp ? "speaking" : "writing"} response using the DET subscore scale (10-160, multiples of 5) and official DET production criteria:
- task (0-5): relevance, task completion, development of ideas with academic details/examples
- grammar (0-5): grammatical accuracy and structural complexity
- vocabulary (0-5): lexical sophistication, academic precision, and diversity
- coherence (0-5): logical organization, flow, discourse markers
- ${sp ? "fluency (0-5): volume of speech, continuity and pace (from word count & duration; ignore ASR punctuation/capitalization quirks; pronunciation cannot be assessed)" : "mechanics (0-5): sufficient length, spelling, capitalization, and punctuation"}

Calibration: 10-55 = A1-A2, 60-90 = B1, 95-115 = B2, 120-135 = C1, 140-160 = C2. Be realistic and strict like real DET.

TASK: ${taskText(k, x)}
${sp ? `DURATION: ${secs || 0} seconds, ${n} words${wpm ? `, ~${wpm} WPM` : ""}` : `WORD COUNT: ${n}`}
RESPONSE:
"""${ans}"""

Provide feedback strings (strengths, correction 'why', tips) in clear Bahasa Indonesia, and 'improved' in natural academic English one CEFR level higher keeping the user's ideas.`;

      const schema = {
        type: "OBJECT",
        properties: {
          score: { type: "INTEGER" },
          cefr: { type: "STRING" },
          criteria: {
            type: "OBJECT",
            properties: {
              task: { type: "NUMBER" },
              grammar: { type: "NUMBER" },
              vocabulary: { type: "NUMBER" },
              coherence: { type: "NUMBER" },
              [metricKey]: { type: "NUMBER" }
            },
            required: ["task", "grammar", "vocabulary", "coherence", metricKey]
          },
          strengths: { type: "ARRAY", items: { type: "STRING" } },
          corrections: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                original: { type: "STRING" },
                better: { type: "STRING" },
                why: { type: "STRING" }
              },
              required: ["original", "better", "why"]
            }
          },
          improved: { type: "STRING" },
          tips: { type: "ARRAY", items: { type: "STRING" } }
        },
        required: ["score", "cefr", "criteria", "strengths", "corrections", "improved", "tips"]
      };

      try {
        const v = await fetchGeminiJSON(prompt, schema);
        if (v && typeof v.score === "number") {
          v.score = round5(v.score);
          v.src = "ai";
          return v;
        }
      } catch (e) {
        // Fallback otomatis ke rubrik lokal
      }
      return gradeLocal(k, ans, taskText(k, x), secs);
    }

    function fbHTML(v, sp) {
      if (v.rule) {
        return `
          <p><b>Skor ${sp ? "Speaking" : "Writing"}: <span class="${v.score >= 95 ? "ok" : "no"}">${v.score}</span></b> (${esc(v.cefr)})</p>
          ${v.rule}
          <p class="note" style="margin-top:8px">Penilaian AI sedang tidak tersedia, sehingga dipakai rubrik otomatis lokal.</p>`;
      }

      const C = {
        task: "Isi & tugas",
        grammar: "Tata bahasa",
        vocabulary: "Kosakata",
        coherence: "Koherensi",
        fluency: "Kelancaran",
        mechanics: "Panjang & ejaan"
      };

      const cr = Object.entries(v.criteria || {})
        .map(([a, b]) => `
          <div style="display:flex;align-items:center;gap:10px;margin:6px 0">
            <span style="width:130px;font-size:14px;font-weight:700;flex-shrink:0">${C[a] || a}</span>
            <div class="pb" style="flex:1">
              <div><i style="width:${(Math.max(0, Math.min(5, b)) / 5) * 100}%"></i></div>
              <span>${b}/5</span>
            </div>
          </div>`)
        .join("");

      const listBlock = (title, arr) =>
        arr && arr.length
          ? `<p style="margin:14px 0 4px"><b>${title}</b></p><ul class="pts">${arr.map((z) => `<li>${esc(z)}</li>`).join("")}</ul>`
          : "";

      return `
        <p style="font-size:16px"><b>Skor ${sp ? "Speaking" : "Writing"}: <span class="${v.score >= 95 ? "ok" : "no"}">${v.score}</span></b> <span class="note">(${esc(v.cefr || lvl(v.score))})</span></p>
        ${cr}
        ${listBlock("✅ Kelebihan", v.strengths)}
        ${
          v.corrections && v.corrections.length
            ? `<p style="margin:14px 0 4px"><b>✏️ Koreksi dari jawabanmu</b></p>
               <div class="tbl-wrap">
                 <table>
                   <tr><th>Perbaikan</th><th>Alasan</th></tr>
                   ${v.corrections
                     .map((c) => `<tr><td><s style="color:var(--r)">${esc(c.original || "")}</s><br><span class="ok">${esc(c.better || "")}</span></td><td class="note">${esc(c.why || "")}</td></tr>`)
                     .join("")}
                 </table>
               </div>`
            : ""
        }
        ${listBlock("💡 Saran perbaikan", v.tips)}
        ${
          v.improved
            ? `<details open>
                 <summary>📝 Contoh jawaban yang lebih baik</summary>
                 <div style="background:#ffffff;border:1.5px solid #e5e5e5;border-radius:12px;padding:12px;margin-top:8px;white-space:pre-wrap;line-height:1.65">${esc(v.improved)}</div>
               </details>`
            : ""
        }
        <p class="note" style="margin-top:10px">Dinilai oleh AI Gemini memakai kriteria resmi DET. Skor bersifat perkiraan latihan.</p>`;
    }

    async function grade(k, x, r, cb) {
      r.parts = {};
      const cat = catOf(k);
      if (r.max && k !== "il") r.parts[cat] = band(r.sc / r.max);
      if (k === "il") r.parts.listening = band(r.sc / r.max);

      const ans = r.txt != null ? r.txt : SPK.includes(k) ? (r.tr || "") : null;
      if (ans != null) {
        stop();
        appEl.innerHTML = `
          <div class="qcard">
            <div class="qbody" style="text-align:center;padding:48px 20px">
              <span class="tag">${esc(r.n)}</span>
              <h2 style="margin-top:8px">Menilai jawabanmu...</h2>
              <p class="sub">AI Gemini sedang membaca jawabanmu dan menyiapkan skor, koreksi kalimat, serta saran perbaikan.</p>
              <div style="margin-top:18px"><span class="spin dark" style="width:32px;height:32px;border-width:4px"></span></div>
            </div>
          </div>`;
        const sp = SPK.includes(k);
        const v = await aiGrade(k, x, ans, r.secs);
        r.parts[sp ? "speaking" : "writing"] = v.score;
        r.fb = (k === "il" ? `<p style="margin-bottom:10px"><b>Listening (pilihan balasan): ${r.sc}/${r.max} → Skor ${r.parts.listening}</b></p>` : "") + fbHTML(v, sp);
        if (sp) r.trShow = ans;
      }

      const vals = Object.values(r.parts);
      r.band = vals.length ? round5(mean(vals)) : null;
      cb(r);
    }

    function detail(r) {
      return `
        ${r.fb ? `<div class="passage" style="margin-top:12px">${r.fb}</div>` : ""}
        <div class="passage" style="margin-top:12px">
          ${r.d ? `<div>${r.d}</div>` : ""}
          ${r.trShow != null ? `<p style="margin-top:10px"><b>Transkrip ucapanmu (${wc(r.trShow)} kata, ${r.secs || 0} detik):</b><br>${esc(r.trShow).replace(/\n/g, "<br>") || "<i>(kosong)</i>"}</p>` : ""}
          ${r.txt != null ? `<p style="margin-top:10px"><b>Jawaban Anda (${wc(r.txt)} kata):</b><br><span style="white-space:pre-wrap">${esc(r.txt) || "<i>(kosong)</i>"}</span></p>` : ""}
        </div>`;
    }

    function practice(k, i) {
      VIEW = "test";
      $("#prog").style.visibility = "hidden";
      T0 = Date.now();
      const tot = totalPackets(k);

      run(k, item(k, i), (r) => {
        stop();
        if (r.band != null) {
          hist.add({ t: Date.now(), k, s: r.band, p: r.parts, d: Math.round((Date.now() - T0) / 1000) });
          const P = store.get();
          P[k] = P[k] || [];
          P[k][i] = Math.max(P[k][i] ?? -1, r.band);
          store.set(P);
        }

        const skName = SK.find((x) => x.k === k).n;
        appEl.innerHTML = `
          <span class="tag">${skName} · Paket ${i + 1}</span>
          <h2>Skor: <span class="${r.band >= 95 ? "ok" : "no"}">${r.band}</span> <span style="font-size:15px;color:#777">(${lvl(r.band)})</span></h2>
          ${r.max && !WRT.includes(k) ? `<p class="sub">${r.sc}/${r.max} benar</p>` : ""}
          ${detail(r)}
          ${TIPS[k] ? `<p class="note" style="margin-top:14px"><b>Tips umum:</b> ${TIPS[k]}</p>` : ""}
          <div class="row">
            <button class="btn sec" id="btnToSkill">Daftar paket</button>
            ${i < tot - 1 ? `<button class="btn" id="btnNextPack">Paket berikutnya</button>` : `<button class="btn" id="btnDoneHome">Selesai</button>`}
          </div>`;

        $("#btnToSkill").onclick = () => skill(k);
        if ($("#btnNextPack")) $("#btnNextPack").onclick = () => practice(k, i + 1);
        if ($("#btnDoneHome")) $("#btnDoneHome").onclick = () => home();
      });
    }

    // =========================================================================
    // 10. HALAMAN PROGRES SAYA (SKORING PROPORSIONAL DET & GRAFIK SVG)
    // =========================================================================
    const dkey = (t) => {
      const d = new Date(t);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    };

    function fmtDur(s) {
      const h = Math.floor(s / 3600);
      const m = Math.round((s % 3600) / 60);
      return h ? `${h} jam ${m} mnt` : `${m} mnt`;
    }

    function partsOf(e) {
      return e.p && Object.keys(e.p).length ? e.p : { [catOf(e.k)]: e.s };
    }

    function detScores(entries) {
      const S = { reading: [], listening: [], writing: [], speaking: [] };
      entries.forEach((e) => {
        const p = partsOf(e);
        for (const c in p) {
          if (S[c] && p[c] != null) S[c].push(p[c]);
        }
      });
      const ind = {}, cnt = {};
      for (const c in S) {
        cnt[c] = S[c].length;
        ind[c] = S[c].length ? round5(mean(S[c])) : null;
      }
      const pair = (a, b) => (ind[a] != null && ind[b] != null ? round5((ind[a] + ind[b]) / 2) : null);
      const integ = {
        Literacy: pair("reading", "writing"),
        Comprehension: pair("reading", "listening"),
        Conversation: pair("listening", "speaking"),
        Production: pair("writing", "speaking")
      };
      const have = Object.values(ind).filter((v) => v != null);
      return { ind, cnt, integ, overall: have.length ? round5(mean(have)) : null, complete: have.length === 4 };
    }

    function detBlock(P) {
      const A = detScores(P);
      const Rc = detScores(P.slice(-20));
      const nm = { reading: "Reading", listening: "Listening", writing: "Writing", speaking: "Speaking" };

      const box = (title, D, sub) => `
        <div class="passage" style="flex:1;min-width:240px;text-align:center;padding:20px 16px">
          <div class="note">${title}</div>
          <div class="big" style="margin:6px 0">${D.overall ?? "–"}</div>
          <div style="font-weight:800;font-size:15px">${D.overall ? "CEFR ≈ " + lvl(D.overall) : "–"}</div>
          <div class="note" style="margin-top:4px">${sub}${D.complete ? "" : "<br>⚠️ Belum semua 4 kemampuan dilatih — Overall dihitung dari kemampuan yang ada"}</div>
        </div>`;

      return `
        <h2 style="margin-top:20px">Skor rata-rata (proporsional DET)</h2>
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">
          ${box("Overall — semua latihan", A, P.length + " latihan")}
          ${box("Overall — 20 latihan terakhir", Rc, "gambaran kemampuanmu sekarang")}
        </div>
        <div class="tbl-wrap">
          <table style="margin-top:14px">
            <tr><th>Individual Subscore</th><th>Rata-rata semua</th><th>20 terakhir</th><th>Jumlah nilai</th><th>Bobot di Overall</th></tr>
            ${Object.keys(nm)
              .map((c) => `<tr><td>${nm[c]}</td><td><b>${A.ind[c] ?? "–"}</b></td><td>${Rc.ind[c] ?? "–"}</td><td>${A.cnt[c]}</td><td>25%</td></tr>`)
              .join("")}
          </table>
        </div>
        <div class="tbl-wrap">
          <table style="margin-top:10px">
            <tr><th>Integrated Subscore</th><th>Rumus</th><th>Semua</th><th>20 terakhir</th></tr>
            ${[
              ["Literacy", "(Reading + Writing) ÷ 2"],
              ["Comprehension", "(Reading + Listening) ÷ 2"],
              ["Conversation", "(Listening + Speaking) ÷ 2"],
              ["Production", "(Writing + Speaking) ÷ 2"]
            ]
              .map(([n, f]) => `<tr><td>${n}</td><td class="note">${f}</td><td><b>${A.integ[n] ?? "–"}</b></td><td>${Rc.integ[n] ?? "–"}</td></tr>`)
              .join("")}
          </table>
        </div>
        <p class="note" style="margin-top:10px">
          Setiap nilai soal masuk ke satu kemampuan (Interactive Listening dibagi ke Listening dan Writing). Rata-rata dihitung per kemampuan dulu, jadi kemampuan yang lebih sering dilatih tidak mendominasi: tiap kemampuan berbobot sama 25% di Overall. Skala 10–160, kelipatan 5.
        </p>`;
    }

    function lineChart(series, labels, h = 225) {
      const W = 680, L = 38, B = 28, T = 12;
      const n = labels.length;
      if (!n) return "";
      const x = (i) => L + (n === 1 ? (W - L - 16) / 2 : (i * (W - L - 16)) / (n - 1));
      const y = (v) => T + (h - T - B) * (1 - (v - 10) / 150);

      let g = [10, 40, 65, 95, 120, 140, 160]
        .map((v) => `<line x1="${L}" x2="${W - 12}" y1="${y(v)}" y2="${y(v)}" stroke="#ececec" /><text x="${L - 7}" y="${y(v) + 4}" font-size="10.5" text-anchor="end" fill="#9ca3af">${v}</text>`)
        .join("");

      const step = Math.max(1, Math.ceil(n / 8));
      g += labels
        .map((l, i) => (i % step === 0 || i === n - 1 ? `<text x="${x(i)}" y="${h - 6}" font-size="10.5" text-anchor="middle" fill="#9ca3af">${l}</text>` : ""))
        .join("");

      series.forEach((s) => {
        const pts = s.v.map((v, i) => (v == null ? null : [x(i), y(v), v, labels[i]])).filter(Boolean);
        if (!pts.length) return;
        if (pts.length > 1) {
          g += `<polyline fill="none" stroke="${s.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p) => p[0] + "," + p[1]).join(" ")}" />`;
        }
        g += pts
          .map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.c}"><title>${s.n} (${p[3]}): ${p[2]}</title></circle>`)
          .join("");
      });

      return `
        <svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block;margin-top:8px">${g}</svg>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px">
          ${series.map((s) => `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:${s.c};display:inline-block"></span>${s.n}</span>`).join("")}
        </div>`;
    }

    function trend(arr) {
      if (arr.length < 2) return `<span class="note">butuh ≥2 latihan</span>`;
      const k = Math.max(1, Math.min(5, Math.floor(arr.length / 2)));
      const a = mean(arr.slice(0, k));
      const b = mean(arr.slice(-k));
      const d = Math.round(b - a);
      return d > 2 ? `<span class="ok">▲ naik ${d} poin</span>` : d < -2 ? `<span class="no">▼ turun ${-d} poin</span>` : `<span class="note">● stabil</span>`;
    }

    function progress() {
      VIEW = "progress";
      stop();
      $("#prog").style.visibility = "hidden";
      const H = hist.get();

      if (!H.length) {
        appEl.innerHTML = `
          <span class="back" id="btnBackHome">← Kembali</span>
          <h1>📈 Progres Saya</h1>
          <p class="sub">Belum ada riwayat latihan. Kerjakan beberapa soal latihan atau Tes Latihan Lengkap terlebih dahulu untuk melihat grafik dan statistik perkembanganmu.</p>
          <div class="row">
            <button class="btn sec" id="btnExIm">Ekspor / Impor Progres (JSON)</button>
            <button class="btn" id="btnGoHome">Mulai Latihan</button>
          </div>`;
        $("#btnBackHome").onclick = () => home();
        $("#btnGoHome").onclick = () => home();
        $("#btnExIm").onclick = () => openExportImportModal();
        return;
      }

      const P = H.filter((e) => !e.full);
      const F = H.filter((e) => e.full);
      const days = [...new Set(H.map((e) => dkey(e.t)))].sort();

      // Hitung hari beruntun (streak)
      let streak = 0;
      {
        const d = new Date();
        for (;;) {
          if (days.includes(dkey(d))) {
            streak++;
            d.setDate(d.getDate() - 1);
          } else if (streak === 0 && dkey(d) === dkey(Date.now())) {
            d.setDate(d.getDate() - 1);
          } else break;
        }
      }

      const lab = days.map((d) => d.slice(8) + "/" + d.slice(5, 7));
      const ser = Object.entries(CC).map(([c, [n, col]]) => ({
        n,
        c: col,
        v: days.map((d) => {
          const arr = P.filter((e) => dkey(e.t) === d).map((e) => partsOf(e)[c]).filter((v) => v != null);
          return arr.length ? Math.round(mean(arr)) : null;
        })
      }));

      const cards = Object.entries(CC)
        .map(([c, [n, col]]) => {
          const arr = P.map((e) => partsOf(e)[c]).filter((v) => v != null);
          const now = arr.length ? Math.round(mean(arr.slice(-5))) : null;
          return `
            <div class="sk" style="cursor:default;border-left:6px solid ${col}">
              <div style="flex:1">
                <h3 style="margin-bottom:4px">${n}</h3>
                <div style="font-size:30px;font-weight:900;color:${col};line-height:1.15">
                  ${now ?? "–"} <span style="font-size:14px;color:#6b7280">${now ? lvl(now) : ""}</span>
                </div>
                <div style="font-size:13px;margin-top:4px">${trend(arr)} · ${arr.length} latihan</div>
              </div>
            </div>`;
        })
        .join("");

      const ranked = Object.entries(CC)
        .map(([c, [n]]) => [n, mean(P.map((e) => partsOf(e)[c]).filter((v) => v != null).slice(-5))])
        .filter((x) => x[1] > 0)
        .sort((a, b) => a[1] - b[1]);

      const rows = SK.map((s) => {
        const a = P.filter((e) => e.k === s.k).map((e) => e.s);
        if (!a.length) return "";
        return `<tr><td>${s.ic} ${s.n}</td><td>${a.length}×</td><td>${a[0]}</td><td>${a[a.length - 1]}</td><td><b>${Math.max(...a)}</b></td><td>${trend(a)}</td></tr>`;
      }).join("");

      appEl.innerHTML = `
        <span class="back" id="btnBackHome">← Kembali</span>
        <h1>📈 Progres Saya</h1>

        <div class="grid3" style="margin-bottom:18px">
          ${[
            ["Total sesi", H.length],
            ["Waktu latihan", fmtDur(H.reduce((x, e) => x + (e.d || 0), 0))],
            ["Hari beruntun", streak + " 🔥"]
          ]
            .map(([a, b]) => `<div class="passage" style="text-align:center"><div class="note">${a}</div><div style="font-size:24px;font-weight:900;margin-top:4px">${b}</div></div>`)
            .join("")}
        </div>

        ${detBlock(P)}

        <h2 style="margin-top:24px">Kemampuan saat ini</h2>
        <p class="note" style="margin-bottom:12px">Rata-rata 5 latihan terakhir (skala 10–160). Tren = rata-rata latihan awal dibanding latihan terbaru.</p>
        <div class="grid2">${cards}</div>

        ${ranked.length > 1 ? `<div class="passage" style="margin-top:14px;font-size:15px">💪 Paling kuat: <b>${ranked[ranked.length - 1][0]}</b> · 🎯 Perlu difokuskan: <b>${ranked[0][0]}</b></div>` : ""}

        <h2 style="margin-top:26px">Skor harian per kemampuan</h2>
        ${lineChart(
          ser.concat([
            {
              n: "Overall (kumulatif)",
              c: "#4b4b4b",
              v: days.map((d) => detScores(P.filter((e) => dkey(e.t) <= d)).overall)
            }
          ]),
          lab
        )}
        <p class="note" style="margin-top:8px">Garis abu-abu = skor Overall proporsional dari semua latihan sampai hari itu.</p>

        ${
          F.length
            ? `<h2 style="margin-top:24px">Riwayat Tes Latihan Lengkap</h2>
               ${lineChart(
                 [
                   { n: "Skor total", c: "#4b4b4b", v: F.map((e) => e.s) },
                   ...["Reading", "Listening", "Writing", "Speaking"].map((n, idx) => ({
                     n,
                     c: ["#1cb0f6", "#ce82ff", "#ff9600", "#58cc02"][idx],
                     v: F.map((e) => e.sub?.[n] ?? null)
                   }))
                 ],
                 F.map((e) => {
                   const d = new Date(e.t);
                   return d.getDate() + "/" + (d.getMonth() + 1);
                 })
               )}
               <p class="note" style="margin-top:6px">${F.length} tes · terakhir <b>${F[F.length - 1].s}</b> · ${trend(F.map((e) => e.s))}</p>`
            : `<p class="note" style="margin-top:14px">Kerjakan Tes Latihan Lengkap untuk melihat grafik skor total dan subskor.</p>`
        }

        <h2 style="margin-top:26px">Detail per tipe soal</h2>
        <div class="tbl-wrap">
          <table>
            <tr><th>Tipe</th><th>Latihan</th><th>Pertama</th><th>Terakhir</th><th>Terbaik</th><th>Tren</th></tr>
            ${rows || `<tr><td colspan="6" class="note">Belum ada latihan per tipe soal.</td></tr>`}
          </table>
        </div>

        <div class="row" style="margin-top:24px;gap:10px">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn sec sm" id="btnResetBadges">Reset Tanda Paket (✓)</button>
            <button class="btn sec sm" id="btnExIm">Ekspor / Impor Progres (JSON)</button>
            <button class="btn danger sm" id="btnResetAll">Reset Semua Progres</button>
          </div>
          <button class="btn" id="btnContinue">LANJUT LATIHAN</button>
        </div>
      `;

      $("#btnBackHome").onclick = () => home();
      $("#btnContinue").onclick = () => home();
      $("#btnExIm").onclick = () => openExportImportModal();

      const btnBadges = $("#btnResetBadges");
      btnBadges.onclick = () => {
        if (btnBadges.dataset.c) resetBadgesOnly();
        else {
          btnBadges.dataset.c = "1";
          btnBadges.textContent = "Klik lagi untuk hapus tanda ✓";
          setTimeout(() => {
            if (btnBadges.isConnected) {
              btnBadges.dataset.c = "";
              btnBadges.textContent = "Reset Tanda Paket (✓)";
            }
          }, 3500);
        }
      };

      const btnRst = $("#btnResetAll");
      btnRst.onclick = () => {
        if (btnRst.dataset.c) resetAll();
        else {
          btnRst.dataset.c = "1";
          btnRst.textContent = "Klik lagi untuk konfirmasi reset";
          setTimeout(() => {
            if (btnRst.isConnected) {
              btnRst.dataset.c = "";
              btnRst.textContent = "Reset Semua Progres";
            }
          }, 3500);
        }
      };
    }

    // Modal Ekspor & Impor Progres JSON
    function openExportImportModal() {
      const root = $("#modalRoot");
      const jsonStr = JSON.stringify({ prog: MEM.prog, hist: MEM.hist, customSets: MEM.customSets }, null, 2);

      root.innerHTML = `
        <div class="modal-bg" id="modBg">
          <div class="modal-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <h2 style="margin:0">📦 Ekspor / Impor Progres</h2>
              <span class="qx" id="modClose">✕</span>
            </div>
            <p class="note" style="margin-bottom:12px">Simpan cadangan riwayat skor dan paket AI ke file JSON, atau tempel/unggah JSON untuk memulihkan progresmu.</p>

            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
              <button class="btn blue sm" id="btnDlJson">⬇️ Unduh JSON</button>
              <button class="btn sec sm" id="btnCopyJson">📋 Salin JSON</button>
              <label class="btn sec sm" style="cursor:pointer">
                📂 Unggah File JSON
                <input type="file" id="inpFileJson" accept=".json,application/json" style="display:none" />
              </label>
            </div>

            <textarea id="txtJsonBox" style="min-height:160px;font-family:monospace;font-size:12.5px">${esc(jsonStr)}</textarea>

            <div class="row" style="margin-top:14px">
              <button class="btn sec sm" id="btnCloseMod">Tutup</button>
              <button class="btn sm" id="btnImportJson">Impor & Gabungkan</button>
            </div>
          </div>
        </div>`;

      const close = () => { root.innerHTML = ""; };
      $("#modClose").onclick = close;
      $("#btnCloseMod").onclick = close;
      $("#modBg").onclick = (e) => { if (e.target.id === "modBg") close(); };

      $("#btnDlJson").onclick = () => {
        const blob = new Blob([$("#txtJsonBox").value], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `progres-latihan-det-${dkey(Date.now())}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("File progres JSON berhasil diunduh.");
      };

      $("#btnCopyJson").onclick = () => {
        const box = $("#txtJsonBox");
        box.select();
        try {
          document.execCommand("copy");
          showToast("JSON berhasil disalin ke clipboard.");
        } catch (e) {
          showToast("Pilih teks lalu tekan Ctrl+C untuk menyalin.");
        }
      };

      $("#inpFileJson").onchange = (ev) => {
        const file = ev.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          $("#txtJsonBox").value = String(reader.result || "");
          showToast("File terbaca. Klik 'Impor & Gabungkan' untuk menerapkan.");
        };
        reader.readAsText(file);
      };

      $("#btnImportJson").onclick = () => {
        try {
          const parsed = JSON.parse($("#txtJsonBox").value);
          if (parsed.prog && typeof parsed.prog === "object") {
            MEM.prog = mergeProg(MEM.prog, parsed.prog);
          }
          if (Array.isArray(parsed.hist)) {
            const seen = new Set(MEM.hist.map((e) => e.t + "|" + (e.k || "full")));
            const add = parsed.hist.filter((e) => e && e.t && !seen.has(e.t + "|" + (e.k || "full")));
            MEM.hist = MEM.hist.concat(add).sort((a, b) => a.t - b.t);
            const months = [...new Set(add.map((e) => mkey(e.t)))];
            months.forEach((m) => saveMonthHistToCloud(m));
          }
          if (parsed.customSets && typeof parsed.customSets === "object") {
            for (const k in parsed.customSets) {
              MEM.customSets[k] = parsed.customSets[k];
            }
          }
          saveStateToCloud();
          close();
          showToast("Progres berhasil diimpor dan digabungkan!");
          progress();
        } catch (e) {
          showToast("Format JSON tidak valid. Periksa kembali isinya.");
        }
      };
    }

    // =========================================================================
    // 11. TES LATIHAN LENGKAP (16 SOAL MENCAKUP KE-13 TIPE)
    // =========================================================================
    function fullTest() {
      VIEW = "test";
      T0 = Date.now();
      const seq = ["rs", "fb", "ct", "lt", "rs", "fb", "lt", "wp", "sp", "rts", "ir", "il", "ws", "iw", "ss", "is"];
      const usedIdx = {};
      const pickUnique = (k) => {
        const tot = totalPackets(k);
        usedIdx[k] = usedIdx[k] || new Set();
        let idx = Math.floor(Math.random() * tot);
        let tries = 0;
        while (usedIdx[k].has(idx) && tries++ < 30) {
          idx = Math.floor(Math.random() * tot);
        }
        usedIdx[k].add(idx);
        return idx;
      };

      let j = 0;
      const res = [];
      $("#prog").style.visibility = "visible";

      const step = () => {
        $("#bar").style.width = (j / seq.length) * 100 + "%";
        if (j >= seq.length) return finish(res);
        const k = seq[j];
        run(k, item(k, pickUnique(k)), (x) => {
          res.push(x);
          j++;
          step();
        });
      };
      step();
    }

    function finish(res) {
      stop();
      $("#bar").style.width = "100%";

      const SK4 = [
        ["reading", "Reading"],
        ["listening", "Listening"],
        ["writing", "Writing"],
        ["speaking", "Speaking"]
      ];
      const ind = {};
      SK4.forEach(([c]) => {
        const a = res.map((r) => r.parts && r.parts[c]).filter((v) => v != null);
        ind[c] = a.length ? round5(mean(a)) : 10;
      });

      const INT = [
        ["Literacy", "Reading + Writing", "reading", "writing"],
        ["Comprehension", "Reading + Listening", "reading", "listening"],
        ["Conversation", "Listening + Speaking", "listening", "speaking"],
        ["Production", "Writing + Speaking", "writing", "speaking"]
      ].map(([n, d, a, b]) => [n, d, round5((ind[a] + ind[b]) / 2)]);

      const est = round5(SK4.reduce((x, [c]) => x + ind[c], 0) / 4);

      hist.add({
        t: Date.now(),
        full: 1,
        s: est,
        sub: Object.fromEntries(INT.map((z) => [z[0], z[2]]).concat(SK4.map(([c, n]) => [n, ind[c]]))),
        d: Math.round((Date.now() - T0) / 1000)
      });

      const bar = ([n, d, v]) => `
        <div style="margin:8px 0">
          <b>${n}</b> <span class="note">${d}</span>
          <div class="pb">
            <div><i style="width:${((v - 10) / 150) * 100}%"></i></div>
            <span>${v}</span>
          </div>
        </div>`;

      appEl.innerHTML = `
        <h1>Hasil Tes Latihan Lengkap</h1>
        <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:10px">
          <div class="passage" style="text-align:center;min-width:170px;padding:20px">
            <div class="note">Overall</div>
            <div class="big">${est}</div>
            <b>CEFR ≈ ${lvl(est)}</b>
          </div>
          <div style="flex:1;min-width:250px">
            <p class="note" style="margin:0 0 6px;font-weight:800">Individual Subscores</p>
            ${SK4.map(([c, n]) => bar([n, "", ind[c]])).join("")}
          </div>
        </div>

        <h2 style="margin-top:20px">Integrated Subscores</h2>
        ${INT.map(bar).join("")}

        <div class="passage" style="margin-top:14px;font-size:13.5px">
          <b>Cara pembobotan (mengikuti DET):</b> setiap soal masuk ke satu Individual Subscore (Reading, Listening, Writing, Speaking) — Interactive Listening dihitung ke Listening (pilihan balasan) dan Writing (ringkasan). Setiap skor dirata-rata per kemampuan. Integrated Subscore = rata-rata dua Individual Subscore. Overall = rata-rata 4 Individual Subscore (skala 10–160, kelipatan 5).
        </div>

        <h2 style="margin-top:22px">Rincian Pembahasan per Soal</h2>
        <div class="tbl-wrap">
          <table>
            <tr><th>Soal</th><th>Skor</th><th>Pembahasan</th></tr>
            ${res
              .map(
                (r) => `
                <tr>
                  <td><b>${esc(r.n)}</b><br><span class="note">${Object.keys(r.parts || {}).join(", ")}</span></td>
                  <td><b class="${r.band >= 95 ? "ok" : "no"}">${r.band}</b></td>
                  <td><details><summary>Lihat</summary>${detail(r)}</details></td>
                </tr>`
              )
              .join("")}
          </table>
        </div>

        <div class="row">
          <button class="btn sec" id="btnFinishHome">Beranda</button>
          <button class="btn" id="btnRetryFull">Tes lagi</button>
        </div>`;

      $("#btnFinishHome").onclick = () => home();
      $("#btnRetryFull").onclick = () => fullTest();
    }

    // =========================================================================
    // 12. INISIALISASI APLIKASI
    // =========================================================================
    $("#homeBtn").onclick = () => home();
    home();
    initCloud();
  </script>
</body>
</html>
