"early morning routines", "the history of writing systems", "city traffic solutions", "the life of a chef", "water sports safety", "the role of emotions in decisions", "plant-based diets", "the history of photography studios", "how rumors spread", "caring for houseplants", "earth's magnetic field", "first aid knowledge", "the history of the calendar", "celebrity influence on young people", "mountain villages", "fair trade products", "the importance of sleep for athletes", "youth unemployment", "the history of tea ceremonies", "online reviews and trust", "paper versus digital books", "how glaciers move", "neighborhood cafes", "the history of aviation", "career advice from parents", "recycling glass", "night skies and stargazing", "the role of humor at work", "handmade gifts", "the economics of streaming music", "learning to swim", "desert cities and water supply", "the history of soap", "food traditions at holidays", "car sharing services", "the history of board games", "tropical storms", "kindness among strangers", "museums at night", "coding for children", "waste collection in cities", "the meaning of friendship", "the history of glass", "cultural differences in greetings", "volunteering at hospitals", "studying with background music", "the science of memory loss", "small island economies", "city noise and health", "the history of perfume", "long-distance relationships", "the role of libraries in research", "the psychology of shopping", "mountain biking", "ancient trade routes", "the importance of clean water", "cooking with children", "the history of ice cream", "rainforest medicine", "customer loyalty programs", "the history of radio", "learning sign language", "city rooftops", "the economics of fast food", "the history of tattoos", "travel insurance", "the science of happiness", "how dictionaries are made"];
const CTP=[{"t": "Coffee and Health", "p": "Many people enjoy drinking coffee in the morning. Coffee contains caffeine, which helps the brain stay alert and focused. However, drinking too much can make people feel nervous and may cause trouble sleeping at night. Doctors usually suggest that adults limit themselves to a few cups each day."}, {"t": "Peer Review in Science", "p": "Peer review is the process through which experts evaluate research before it is published. Reviewers assess whether the methods are appropriate and whether the conclusions are supported by the evidence. Although the system is widely respected, critics argue that it can be slow and occasionally biased. Some journals now experiment with open review, in which reviewer comments are published alongside the article."}, {"t": "The Importance of Bees", "p": "Bees play an important role in our food system. As they move from flower to flower, they carry pollen that helps plants produce fruit and seeds. Without bees, many crops such as apples and almonds would be difficult to grow. Sadly, bee populations have declined because of pesticides and habitat loss."}, {"t": "The Replication Crisis", "p": "In recent years, many researchers have discovered that well known findings cannot be reproduced. This problem, often called the replication crisis, has been especially visible in psychology and medicine. Small samples, selective reporting, and pressure to publish surprising results are frequently blamed. In response, scholars increasingly share their data and register their hypotheses before collecting evidence."}, {"t": "Why Recycling Matters", "p": "Recycling helps protect the environment by reducing the amount of waste in landfills. When we recycle paper, glass, and plastic, these materials can be turned into new products. This process saves energy and natural resources. Many cities now provide separate bins to make recycling easier for everyone."}, {"t": "Qualitative Research Methods", "p": "Qualitative research seeks to understand experiences, meanings, and social processes rather than to measure them numerically. Common methods include interviews, focus groups, and detailed observation. Researchers must reflect carefully on how their own background might shape interpretation. When conducted rigorously, qualitative studies can reveal patterns that statistical surveys often overlook."}, {"t": "Our Living Ocean", "p": "The ocean covers more than seventy percent of the Earth's surface. It is home to millions of species, many of which scientists have not yet discovered. The ocean also produces much of the oxygen we breathe and helps control the climate. Protecting it from pollution is essential for all life."}, {"t": "Academic Integrity", "p": "Academic integrity refers to honesty and responsibility in scholarly work. Students are expected to acknowledge the ideas of others through accurate citation. Plagiarism, fabrication of data, and unauthorized collaboration are considered serious violations. Many universities now provide workshops that teach students how to paraphrase and reference sources correctly."}, {"t": "News on Social Media", "p": "Social media has changed the way people share news and information. Today, a single post can reach millions of users within minutes. While this speed can be useful during emergencies, it also allows false information to spread quickly. It is important to check the source before sharing anything online."}, {"t": "Urban Heat Islands", "p": "Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Dark surfaces such as asphalt absorb sunlight and release heat slowly during the night. The problem increases energy demand and poses health risks during heat waves. Planners are responding by expanding green roofs, planting trees, and using reflective building materials."}, {"t": "Modern Libraries", "p": "Libraries are no longer just places to borrow books. Many modern libraries offer free internet access, language classes, and quiet spaces for studying. They also organize events for children and adults in the local community. As a result, libraries remain valuable public spaces in the digital age."}, {"t": "Behavioral Economics", "p": "Traditional economic models assume that individuals make rational decisions to maximize their benefit. Behavioral economics challenges this assumption by showing that people are influenced by habits, emotions, and social norms. For instance, consumers often prefer a default option simply because it requires no effort. Governments have applied these insights to encourage saving and healthier choices."}, {"t": "Gardens in the City", "p": "Urban gardens are becoming popular in many large cities. These green spaces allow residents to grow vegetables, even when they live in small apartments. Gardens also bring neighbors together and create a sense of community. Some studies suggest that spending time with plants can reduce stress."}, {"t": "Antibiotic Resistance", "p": "Antibiotics have saved millions of lives since their introduction in the twentieth century. However, the excessive use of these drugs has allowed resistant bacteria to spread. Infections that were once easy to treat are becoming increasingly difficult to cure. Experts recommend stricter prescription practices and greater investment in the development of new medicines."}, {"t": "Why We Need Sleep", "p": "Sleep is essential for both physical and mental health. During sleep, the body repairs muscles and the brain organizes information from the day. People who do not get enough rest often find it hard to concentrate at work or school. Experts recommend seven to nine hours each night."}, {"t": "Language Acquisition in Children", "p": "Young children acquire their first language with remarkable speed and without formal instruction. Linguists have long debated whether this ability depends on an innate mental capacity or on exposure to rich input. Research suggests that both biological factors and social interaction play essential roles. Children who hear more varied speech generally develop larger vocabularies."}, {"t": "Benefits of Public Transport", "p": "Public transportation offers many advantages to people living in cities. Buses and trains carry large numbers of passengers, which reduces traffic on the roads. They are also usually cheaper than driving a private car. Using public transport produces less pollution, so it is better for the environment."}, {"t": "The Ethics of Artificial Intelligence", "p": "As artificial intelligence becomes more powerful, questions about its ethical use have become urgent. Algorithms trained on historical data may reproduce existing social inequalities. Critics also worry about privacy, accountability, and the concentration of power in a few technology companies. Several governments are therefore drafting regulations to ensure that these systems remain transparent and fair."}, {"t": "The Value of Volunteering", "p": "Volunteering is a great way to support your community. Many volunteers help at hospitals, schools, or animal shelters. Volunteering can also help people develop new skills and meet new friends. Some employers view volunteer experience as valuable when they are hiring new staff."}, {"t": "Microfinance and Development", "p": "Microfinance provides small loans to people who lack access to traditional banking services. Its supporters claim that such loans allow entrepreneurs in poor communities to start businesses and escape poverty. Later studies, however, found that the average impact on household income was modest. Researchers now emphasize that credit works best when combined with training and savings programs."}, {"t": "The Rise of Electric Cars", "p": "Electric cars are becoming more common around the world. Unlike traditional cars, they do not burn fuel, so they produce no harmful gases from the exhaust. However, some drivers worry about how far the cars can travel before charging. As battery technology improves, these concerns are likely to decrease."}, {"t": "Ocean Acidification", "p": "The oceans absorb a substantial portion of the carbon dioxide released by human activity. When this gas dissolves in seawater, it forms an acid that gradually lowers the pH of the ocean. Organisms that build shells, such as corals and certain plankton, find it harder to survive. Because these species support entire food webs, the consequences may extend far beyond the reef."}, {"t": "Learning Music", "p": "Learning a musical instrument has many benefits for the brain. It improves memory and helps children perform better in other subjects. Playing music also requires patience, because progress is often slow. Many adults who start late find the experience just as rewarding as children do."}, {"t": "Cognitive Load Theory", "p": "Cognitive load theory proposes that working memory can process only a limited amount of information at once. When instructional materials are poorly designed, learners waste mental effort on irrelevant details. Effective teaching therefore presents new content in manageable segments and removes unnecessary distractions. The theory has influenced the design of textbooks, online courses, and training programs."}, {"t": "Working from Home", "p": "Working from home has become common for many office workers. It saves time because people do not need to travel to the office every day. However, some workers feel lonely and find it difficult to separate work from family life. Many companies now offer a mix of home and office work."}, {"t": "Sustainable Agriculture", "p": "Modern agriculture has dramatically increased food production, but it has also caused soil erosion and water pollution. Sustainable agriculture aims to meet current food needs without compromising future resources. Techniques such as crop rotation, reduced tillage, and integrated pest management are widely promoted. Adopting these practices often requires financial support and technical advice for farmers."}, {"t": "The Story of Chocolate", "p": "Chocolate comes from the seeds of the cacao tree, which grows in warm tropical regions. Ancient people in Central America made a bitter drink from these seeds. Later, sugar was added in Europe, and chocolate became a popular sweet. Today, most cacao is grown in West Africa."}, {"t": "The Gig Economy", "p": "The gig economy refers to labor markets in which workers complete short term tasks, often through digital platforms. Supporters highlight the flexibility it offers to drivers, designers, and other freelancers. Critics point out that gig workers frequently lack health insurance, pensions, and job security. Courts in several countries are now reconsidering whether such workers should be classified as employees."}, {"t": "Plastic Pollution", "p": "Plastic is cheap, light, and useful, but it creates serious problems for the planet. Most plastic takes hundreds of years to break down. Large amounts end up in rivers and oceans, where they harm fish and birds. Many countries have started to ban single use plastic bags."}, {"t": "Bilingualism and the Brain", "p": "Speaking two languages regularly appears to influence how the brain manages attention. Bilingual individuals must constantly select one language while suppressing the other. Some studies suggest that this practice strengthens executive control, although the evidence remains mixed. Researchers agree, nevertheless, that bilingualism offers clear cultural and professional advantages."}, {"t": "Healthy Breakfast", "p": "Breakfast is often called the most important meal of the day. A healthy breakfast gives the body energy after a long night without food. Students who eat breakfast usually find it easier to pay attention in class. Good choices include fruit, eggs, yogurt, and whole grain bread."}, {"t": "Renewable Energy Storage", "p": "Solar and wind power are becoming cheaper, yet their output varies with weather conditions. Storing surplus electricity is therefore essential for a reliable energy system. Lithium batteries are the most common solution, but they rely on scarce minerals. Engineers are investigating alternatives such as pumped hydroelectric storage, hydrogen, and compressed air."}, {"t": "The Power of Walking", "p": "Walking is one of the simplest forms of exercise. It does not require special equipment, and almost anyone can do it. Regular walking strengthens the heart, improves mood, and helps control body weight. Doctors often recommend walking at least thirty minutes a day."}, {"t": "Social Capital", "p": "Social capital describes the networks, trust, and shared norms that enable people to cooperate. Communities with high levels of social capital tend to solve collective problems more effectively. Political scientists have linked declining civic participation to weaker social bonds. Others argue that online communities are creating new forms of connection rather than destroying old ones."}, {"t": "Learning a Second Language", "p": "Learning a second language can open many doors. It allows people to communicate with others from different cultures and to travel more easily. It can also improve job opportunities in a global economy. Research shows that language learning may even keep the brain healthy in old age."}, {"t": "The Placebo Effect", "p": "A placebo is a treatment with no active ingredient, yet patients who receive it sometimes report genuine improvement. This placebo effect demonstrates the powerful influence of expectation on perceived health. Clinical trials therefore compare new drugs against placebos to determine their true effectiveness. Interestingly, the effect can occur even when patients know they are receiving a placebo."}, {"t": "Tourism and Local Life", "p": "Tourism brings money and jobs to many cities and villages. Hotels, restaurants, and shops all benefit when visitors arrive. However, too many tourists can cause crowded streets, higher prices, and damage to historic places. Some cities now limit the number of visitors each day."}, {"t": "Globalization and Culture", "p": "Globalization has intensified the exchange of goods, ideas, and cultural products across borders. Some observers fear that local traditions will disappear under the influence of global media. Others argue that cultures adapt creatively, blending foreign elements with local practices. The outcome appears to depend on economic power, education, and government policy."}, {"t": "The Life of Rainforests", "p": "Rainforests cover only a small part of the Earth, but they contain more than half of all plant and animal species. They also absorb large amounts of carbon dioxide from the air. Every year, large areas of rainforest are cut down for farming. Protecting them is important for the whole planet."}, {"t": "Deforestation in the Tropics", "p": "Tropical forests are being cleared at an alarming rate to create space for cattle ranching and plantations. This loss threatens countless species and releases large quantities of stored carbon. Indigenous communities that depend on the forest are often displaced. International agreements now offer financial incentives to countries that reduce deforestation."}, {"t": "Video Games and Learning", "p": "Video games are often seen as a waste of time, but some can actually help people learn. Certain games improve problem solving and quick decision making. Others teach history, science, or teamwork in an enjoyable way. The key is to choose games carefully and to play in moderation."}, {"t": "Motivation in Education", "p": "Psychologists distinguish between intrinsic motivation, which comes from personal interest, and extrinsic motivation, which depends on external rewards. Research indicates that intrinsic motivation is associated with deeper learning and greater persistence. Excessive reliance on grades and prizes can sometimes reduce genuine curiosity. Teachers can foster motivation by offering choice and meaningful challenges."}, {"t": "Saving Water at Home", "p": "Clean water is a limited resource in many parts of the world. Simple habits at home can help save large amounts of water. For example, people can take shorter showers and turn off the tap while brushing their teeth. Fixing leaking pipes quickly also prevents a lot of waste."}, {"t": "Water Scarcity", "p": "Although water covers most of the planet, only a small fraction is fresh and accessible. Population growth, agriculture, and climate change are placing increasing pressure on these limited supplies. In some regions, groundwater is being extracted faster than it can be replenished. Efficient irrigation and wastewater recycling are considered key strategies for the future."}, {"t": "The First Airplane", "p": "In 1903, the Wright brothers made the first powered airplane flight in the United States. The flight lasted only twelve seconds and covered a short distance. Even so, it changed transportation forever. Within a few decades, airplanes were carrying passengers across oceans and continents."}, {"t": "Confirmation Bias", "p": "Confirmation bias is the tendency to search for and interpret information in ways that support existing beliefs. People often dismiss evidence that contradicts their views while accepting weak evidence that agrees with them. This bias can affect scientists, judges, and voters alike. Deliberately considering alternative explanations is one effective way to reduce its influence."}, {"t": "Street Food Culture", "p": "Street food is an important part of daily life in many countries. It is usually cheap, quick, and full of local flavor. Travelers often say that eating street food is the best way to understand a new culture. However, it is wise to choose stalls that look clean and busy."}, {"t": "Public Health and Vaccination", "p": "Vaccination is one of the most successful public health interventions in history. By training the immune system to recognize specific pathogens, vaccines prevent disease in individuals and reduce transmission within communities. When enough people are immunized, even those who cannot be vaccinated receive protection. Maintaining public trust is essential to sustaining high vaccination rates."}, {"t": "Online Shopping", "p": "Online shopping has grown quickly over the past twenty years. Customers can compare prices, read reviews, and order products without leaving home. This convenience has hurt many small local shops. On the other hand, it has helped some small businesses reach customers in other countries."}, {"t": "The History of the Printing Press", "p": "The invention of the printing press in the fifteenth century transformed the circulation of knowledge in Europe. Books became cheaper and more widely available, which contributed to rising literacy. The technology also helped spread new religious and scientific ideas rapidly. Historians often compare its impact to that of the internet in the modern era."}];
const IRP=[{"t": "The Benefits of Reading", "p": "Reading regularly brings many benefits. It increases vocabulary, improves writing skills, and helps people understand different points of view. Reading fiction can also make people more patient and caring toward others. Even fifteen minutes of reading each day can make a difference over time."}, {"t": "Mental Health Among Graduate Students", "p": "Surveys indicate that graduate students experience anxiety and depression at higher rates than the general population. Long working hours, financial pressure, and uncertain career prospects contribute to this stress. Supportive supervisors and clear expectations are associated with better wellbeing. Many universities are expanding counseling services specifically for postgraduate researchers."}, {"t": "Solar Energy", "p": "Solar energy comes directly from the sun and will never run out. Solar panels turn sunlight into electricity that can power homes and businesses. The cost of these panels has fallen sharply in recent years. As a result, many families now produce some of their own electricity."}, {"t": "Carbon Pricing", "p": "Carbon pricing assigns a cost to greenhouse gas emissions in order to encourage reductions. Governments may impose a direct tax or establish a market in which companies trade emission permits. Economists generally favor this approach because it allows firms to find the cheapest ways to cut pollution. Political resistance often arises when energy prices increase for households."}, {"t": "Smartphones and Teenagers", "p": "Most teenagers today own a smartphone. Phones help them stay in touch with friends and find information quickly. However, spending too much time on screens can affect sleep and concentration. Many parents set rules about when and where phones may be used."}, {"t": "The Flipped Classroom", "p": "In a flipped classroom, students study instructional content at home and use class time for discussion and problem solving. This approach allows teachers to provide more individual guidance during lessons. Its success depends heavily on whether students complete the preparatory work. Evidence suggests modest benefits, particularly in science and mathematics courses."}, {"t": "The Role of Museums", "p": "Museums keep important objects from the past and present them to the public. They help visitors learn about history, art, and science in an interesting way. Many museums now offer interactive displays and online tours. Some people believe that all museums should be free to enter."}, {"t": "Endangered Languages", "p": "Linguists estimate that nearly half of the world's languages may disappear by the end of this century. When a language is lost, unique knowledge about history, ecology, and culture often disappears with it. Many endangered languages are spoken mainly by older community members. Documentation projects and bilingual schools are attempting to reverse this decline."}, {"t": "Fast Fashion", "p": "Fast fashion means producing cheap clothes very quickly to follow the latest trends. It allows people to buy new styles at low prices. However, it creates large amounts of waste and often depends on low paid workers. Some shoppers now prefer to buy fewer clothes of better quality."}, {"t": "Big Data and Privacy", "p": "Companies and governments now collect vast amounts of data about online behavior. This information can improve services, but it also raises serious privacy concerns. Even anonymized data can sometimes be linked back to specific individuals. Data protection laws require organizations to obtain consent and to explain how personal information is used."}, {"t": "Life in Antarctica", "p": "Antarctica is the coldest, windiest, and driest continent on Earth. Nobody lives there permanently, but scientists from many countries stay at research stations. They study the ice, the weather, and the animals that live there. The ice also holds clues about the climate of the distant past."}, {"t": "The Economics of Education", "p": "Economists view education as an investment that increases the productivity and earnings of individuals. Countries with higher levels of education generally experience faster economic growth. However, the returns depend on the quality of schooling rather than merely the number of years completed. Early childhood programs have shown particularly high long term benefits."}, {"t": "The Habit of Saving Money", "p": "Saving money is an important habit for a secure future. Experts suggest putting aside a small part of every salary, even if the amount is small. Savings can help people deal with emergencies such as illness or losing a job. They also make it possible to reach bigger goals later."}, {"t": "Invasive Species", "p": "Invasive species are organisms introduced to environments where they did not previously exist. Without natural predators, they can spread rapidly and displace native species. Some invasions are accidental, while others result from deliberate introductions for agriculture or pest control. Preventing introductions is far cheaper than attempting to eradicate established populations."}, {"t": "Pets and Wellbeing", "p": "Many people say their pets make them happier. Studies show that spending time with animals can lower stress and blood pressure. Dogs also encourage their owners to go outside and exercise. However, looking after a pet requires time, money, and responsibility."}, {"t": "Leadership Styles", "p": "Organizational researchers distinguish between transactional and transformational leadership. Transactional leaders rely on rewards and penalties to achieve specific goals. Transformational leaders, in contrast, inspire followers through a shared vision and personal example. Studies associate transformational leadership with higher employee satisfaction and innovation."}, {"t": "The Growth of Cities", "p": "More than half of the world's population now lives in cities. People move to urban areas to find jobs, education, and better services. However, fast growth can lead to traffic, pollution, and expensive housing. City planners are looking for ways to make cities more livable."}, {"t": "Vaccine Development Timelines", "p": "Developing a new vaccine traditionally takes many years of laboratory research and clinical testing. During recent health emergencies, researchers accelerated this process by conducting trial phases in parallel. New technologies also allowed scientists to design candidate vaccines within weeks. Regulators maintained safety requirements while reviewing data more rapidly."}, {"t": "Team Sports", "p": "Playing team sports teaches young people valuable lessons. Players learn to cooperate, communicate, and support each other. They also learn how to win with respect and lose with dignity. These skills are useful not only on the field but also at school and work."}, {"t": "Smart Cities", "p": "Smart cities use sensors and data analysis to manage traffic, energy, and public services more efficiently. For example, connected traffic lights can adjust timing according to real time conditions. Critics warn that constant data collection may threaten residents' privacy. Successful projects usually involve citizens in planning decisions from the beginning."}, {"t": "The Invention of Paper", "p": "Paper was first invented in China about two thousand years ago. Before that, people wrote on materials such as stone, clay, silk, and animal skin. Paper was cheaper and easier to carry, so knowledge could spread more widely. Today, paper is still used every day around the world."}, {"t": "The Importance of Wetlands", "p": "Wetlands act as natural filters that remove pollutants from water. They also store floodwater and provide habitat for many birds and fish. Despite these benefits, wetlands have been drained extensively for agriculture and urban development. Restoration projects can recover some functions, but natural wetlands are difficult to replace."}, {"t": "Climate and Weather", "p": "Many people confuse weather and climate. Weather describes conditions over a short time, such as a rainy afternoon. Climate describes the average conditions in a place over many years. Scientists warn that the global climate is getting warmer because of human activities."}, {"t": "Academic Writing Conventions", "p": "Academic writing follows conventions that differ from everyday communication. Writers are expected to present clear arguments supported by credible evidence. Claims are often qualified with cautious language to avoid overstating conclusions. Mastering these conventions is particularly challenging for students writing in a second language."}, {"t": "Handwriting in the Digital Age", "p": "Fewer people write by hand now that computers and phones are common. Some schools spend less time teaching handwriting than in the past. However, research suggests that writing notes by hand can help students remember information better. Many teachers still encourage students to practice it."}, {"t": "Population Aging", "p": "Many countries are experiencing rapid population aging due to lower birth rates and longer life expectancy. A growing proportion of older citizens places pressure on pension systems and healthcare services. Some governments are raising the retirement age or encouraging immigration. Older adults also contribute substantially through volunteering and caregiving."}, {"t": "Food Waste", "p": "A large amount of food is wasted every year around the world. Some is lost on farms, while much more is thrown away by shops and families. Planning meals and storing food correctly can reduce this waste. Some supermarkets now give unsold food to charities."}, {"t": "Supply Chain Resilience", "p": "Global supply chains allow companies to produce goods efficiently by sourcing components from many countries. However, recent disruptions revealed how vulnerable these networks can be. A single factory closure may delay production across entire industries. Firms are now diversifying suppliers and holding larger inventories to improve resilience."}, {"t": "The Benefits of Travel", "p": "Traveling to new places can broaden the mind. Travelers experience different foods, languages, and traditions. They often return home with a better understanding of the world and of themselves. Even short trips to nearby towns can offer new and interesting experiences."}, {"t": "The Hawthorne Effect", "p": "The Hawthorne effect refers to changes in behavior that occur because people know they are being observed. The term originated from studies of factory workers in the early twentieth century. Researchers must consider this effect when designing observational studies. Unobtrusive measurement methods can reduce its influence on results."}, {"t": "Robots at Work", "p": "Robots are now used in many factories to do repetitive tasks. They can work for long hours without getting tired and often make fewer mistakes than humans. Some people worry that robots will take away jobs. Others believe robots will create new types of work."}, {"t": "Soil Health", "p": "Healthy soil contains a complex community of microorganisms that recycle nutrients and support plant growth. Intensive farming and chemical fertilizers can degrade this living system over time. Degraded soils hold less water and store less carbon. Practices such as cover cropping and composting help restore soil fertility."}, {"t": "The History of the Bicycle", "p": "The first bicycles appeared in Europe in the early nineteenth century. Early models had no pedals, so riders pushed them along with their feet. Over time, designers added pedals, chains, and rubber tires. Today, bicycles are a cheap and healthy way to travel in cities."}, {"t": "Nudge Theory in Public Policy", "p": "Nudge theory suggests that small changes in how choices are presented can influence behavior without restricting freedom. For example, placing healthy food at eye level may increase its consumption. Governments have created specialized units to design such interventions. Critics argue that nudges can be manipulative if citizens are unaware of them."}, {"t": "Stress Among Students", "p": "Many students feel stressed because of exams and homework. A little stress can motivate people to work hard, but too much can harm health. Regular exercise, enough sleep, and talking with friends can help. Schools are also offering more support services for students."}, {"t": "Intellectual Property", "p": "Intellectual property laws protect creations of the mind, such as inventions, designs, and artistic works. Patents give inventors exclusive rights for a limited period, encouraging investment in research. However, strong protection can also restrict access to essential medicines and knowledge. Policymakers must balance incentives for innovation with the public interest."}, {"t": "Wild Animals in Danger", "p": "Many wild animals are in danger of disappearing forever. The main causes are hunting, pollution, and the destruction of natural habitats. National parks and protected areas give these animals safe places to live. Education also helps people understand why wildlife matters."}, {"t": "Glacier Retreat", "p": "Glaciers around the world are shrinking as global temperatures rise. Meltwater from glaciers supplies rivers that support agriculture and drinking water for millions of people. In the short term, melting increases river flow, but long term supplies will decline. Glacial retreat also contributes to rising sea levels."}, {"t": "Cooking at Home", "p": "Cooking at home is often healthier than eating at restaurants. People can choose fresh ingredients and control the amount of salt, sugar, and oil. Home cooking is also usually cheaper. In addition, preparing meals together can bring family members closer."}, {"t": "Learning Analytics", "p": "Learning analytics uses data from digital platforms to understand and improve student learning. Institutions can identify students who may be at risk of failing and offer early support. Instructors can also see which materials students find most difficult. Ethical guidelines are needed to ensure that such data are used transparently and fairly."}, {"t": "The Internet in Education", "p": "The internet has changed the way students learn. They can watch lessons online, find information instantly, and join study groups with people far away. However, not all information online is accurate. Students need to learn how to judge whether a source is reliable."}, {"t": "The Mediterranean Diet", "p": "The Mediterranean diet emphasizes vegetables, legumes, whole grains, fish, and olive oil. Numerous studies have associated this eating pattern with lower rates of heart disease. Researchers believe that the combination of nutrients, rather than any single food, explains these benefits. Social aspects of meals may also contribute to wellbeing."}, {"t": "Festivals Around the World", "p": "Festivals are celebrated in every culture. They often mark important events such as harvests, religious holidays, or the new year. Festivals usually include music, dancing, special food, and colorful decorations. They help people feel connected to their community and traditions."}, {"t": "Microplastics in Agriculture", "p": "Microplastics are increasingly detected in agricultural soils as well as in oceans. Sources include plastic mulch films, sewage sludge used as fertilizer, and irrigation water. Scientists are still investigating how these particles affect soil organisms and crop growth. Some evidence suggests that plants may absorb extremely small particles through their roots."}, {"t": "Drinking Enough Water", "p": "Water makes up a large part of the human body. Drinking enough water helps control body temperature and keeps the brain working well. People who do not drink enough may feel tired or get headaches. Most adults should drink several glasses of water each day."}, {"t": "Workplace Diversity", "p": "Organizations with diverse employees may benefit from a wider range of perspectives and problem solving approaches. Diversity can improve decision making, particularly when team members feel able to express disagreement. However, diversity alone does not guarantee positive outcomes. Inclusive leadership and fair policies are necessary to realize its potential."}, {"t": "Space Exploration", "p": "Humans have explored space for more than sixty years. Astronauts have walked on the moon, and robots have landed on Mars. Space research has also led to useful inventions such as better weather forecasts. Some companies now plan to offer space travel to tourists."}, {"t": "Space Debris", "p": "Thousands of defunct satellites and fragments now orbit the Earth at high speeds. Collisions with this debris can damage operational spacecraft and create even more fragments. As satellite launches increase, the risk is growing rapidly. Engineers are developing methods to remove debris and design satellites that safely leave orbit."}, {"t": "Small Businesses", "p": "Small businesses play an important role in local economies. They create jobs and often offer products that large companies do not. Owners usually know their customers personally. However, small businesses can struggle to compete with big stores and online shops."}, {"t": "The Bystander Effect", "p": "The bystander effect describes the tendency of individuals to be less likely to help a victim when other people are present. Responsibility appears to be diffused among the group, so each person assumes someone else will act. Classic experiments demonstrated this pattern in emergency situations. Training people to recognize the effect can increase helping behavior."}];

function ioPanel(){return`<h2 style="margin-top:22px">💾 Cadangan progres</h2><div class="passage"><p style="margin:0 0 10px">Unduh progresmu sebagai file JSON agar tidak hilang. Upload kembali kapan saja; data digabung tanpa duplikat.</p>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="exportProg()">⬇️ Download progres (JSON)</button><label class="btn sec" style="display:inline-block">⬆️ Upload progres<input type="file" accept=".json,application/json" id="iofile" style="display:none"></label><button class="btn sec" onclick="document.getElementById('iopaste').style.display='block'">📋 Tempel teks</button></div>
 <div id="iopaste" style="display:none;margin-top:10px"><textarea id="iopt" style="min-height:90px;font-size:12px" placeholder="Tempel isi file progres di sini"></textarea><button class="btn sec" style="margin-top:6px" onclick="importText(document.getElementById('iopt').value)">Pulihkan</button></div>
 <p id="iomsg" class="note" style="margin-top:10px"></p><div id="iobox"></div></div>`}
function bindIO(){const f=document.getElementById("iofile");if(f)f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>importText(String(rd.result));rd.readAsText(file);f.value=""}}
// ===== PROGRES =====
// skor per kemampuan dari satu entri (pakai parts bila ada, mis. Interactive Listening = listening + writing)
function partsOf(e){return e.p&&Object.keys(e.p).length?e.p:{[catOf(e.k)]:e.s}}
// Skor proporsional ala DET: tiap soal -> 1 Individual Subscore (rata-rata per kemampuan),
// Integrated = rata-rata 2 Individual, Overall = rata-rata 4 Individual (bobot sama 25%).
function detScores(entries){const S={reading:[],listening:[],writing:[],speaking:[]};entries.forEach(e=>{const p=partsOf(e);for(const c in p)if(S[c]&&p[c]!=null)S[c].push(p[c])});
 const ind={},cnt={};for(const c in S){cnt[c]=S[c].length;ind[c]=S[c].length?round5(mean(S[c])):null}
 const pair=(a,b)=>ind[a]!=null&&ind[b]!=null?round5((ind[a]+ind[b])/2):null;
 const integ={Literacy:pair("reading","writing"),Comprehension:pair("reading","listening"),Conversation:pair("listening","speaking"),Production:pair("writing","speaking")};
 const have=Object.values(ind).filter(v=>v!=null);return{ind,cnt,integ,overall:have.length?round5(mean(have)):null,complete:have.length==4}}
function detBlock(P){const A=detScores(P),Rc=detScores(P.slice(-20)),nm={reading:"Reading",listening:"Listening",writing:"Writing",speaking:"Speaking"};
 const box=(t,D,sub)=>`<div class="passage" style="flex:1;min-width:250px;text-align:center"><div class="note">${t}</div><div class="big" style="font-size:48px">${D.overall??"–"}</div><b>${D.overall?"CEFR ≈ "+lvl(D.overall):""}</b><div class="note">${sub}${D.complete?"":"<br>⚠️ Belum semua kemampuan dilatih — Overall dari kemampuan yang ada saja"}</div></div>`;
 return`<h2>Skor rata-rata (proporsional DET)</h2><div style="display:flex;gap:12px;flex-wrap:wrap">${box("Overall — semua latihan",A,P.length+" latihan")}${box("Overall — 20 latihan terakhir",Rc,"gambaran kemampuanmu sekarang")}</div>
 <table style="margin-top:10px"><tr><th>Individual Subscore</th><th>Rata-rata semua</th><th>20 terakhir</th><th>Jumlah nilai</th><th>Bobot di Overall</th></tr>${Object.keys(nm).map(c=>`<tr><td>${nm[c]}</td><td><b>${A.ind[c]??"–"}</b></td><td>${Rc.ind[c]??"–"}</td><td>${A.cnt[c]}</td><td>25%</td></tr>`).join("")}</table>
 <table style="margin-top:6px"><tr><th>Integrated Subscore</th><th>Rumus</th><th>Semua</th><th>20 terakhir</th></tr>${[["Literacy","(Reading + Writing) ÷ 2"],["Comprehension","(Reading + Listening) ÷ 2"],["Conversation","(Listening + Speaking) ÷ 2"],["Production","(Writing + Speaking) ÷ 2"]].map(([n,f])=>`<tr><td>${n}</td><td class="note">${f}</td><td><b>${A.integ[n]??"–"}</b></td><td>${Rc.integ[n]??"–"}</td></tr>`).join("")}</table>
 <p class="note">Setiap nilai soal masuk ke satu kemampuan (Interactive Listening dibagi ke Listening dan Writing). Rata-rata dihitung per kemampuan dulu, jadi kemampuan yang lebih sering dilatih tidak mendominasi: tiap kemampuan berbobot sama 25% di Overall. Skala 10–160, kelipatan 5.</p>`}

const CC={reading:["Reading","#1cb0f6"],writing:["Writing","#ff9600"],listening:["Listening","#ce82ff"],speaking:["Speaking","#58cc02"]};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function fmtDur(s){const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h} jam ${m} mnt`:`${m} mnt`}
function lineChart(series,labels,h=220){const W=680,L=36,B=26,T=10,n=labels.length;if(!n)return"";const x=i=>L+(n==1?(W-L-10)/2:i*(W-L-10)/(n-1)),y=v=>T+(h-T-B)*(1-(v-10)/150);
 let g=[10,40,65,95,120,140,160].map(v=>`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#999">${v}</text>`).join("");
 const step=Math.ceil(n/8);g+=labels.map((l,i)=>i%step==0||i==n-1?`<text x="${x(i)}" y="${h-6}" font-size="10" text-anchor="middle" fill="#999">${l}</text>`:"").join("");
 series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`+pts.map((p,j)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.c}"><title>${s.n}: ${s.v.filter(v=>v!=null)[j]}</title></circle>`).join("")});
 return`<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto">${g}</svg><div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px">${series.map(s=>`<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${s.c};vertical-align:-1px"></span> ${s.n}</span>`).join("")}</div>`}
function trend(arr){if(arr.length<2)return`<span class="note">butuh ≥2 latihan</span>`;const k=Math.max(1,Math.min(5,Math.floor(arr.length/2))),a=mean(arr.slice(0,k)),b=mean(arr.slice(-k)),d=Math.round(b-a);
 return d>2?`<span class="ok">▲ naik ${d} poin</span>`:d<-2?`<span class="no">▼ turun ${-d} poin</span>`:`<span class="note">● stabil</span>`}
function progress(){VIEW="progress";stop();$("#prog").style.visibility="hidden";const H=hist.get();
 if(!H.length){app.innerHTML=`<span class="back" onclick="home()">← Kembali</span><h1>📈 Progres Saya</h1><p class="sub">Belum ada riwayat. Kerjakan beberapa soal latihan atau tes lengkap, lalu kembali ke sini untuk melihat perkembanganmu.</p>${ioPanel()}`;bindIO();return}
 const P=H.filter(e=>!e.full),F=H.filter(e=>e.full),days=[...new Set(H.map(e=>dkey(e.t)))].sort();
 let streak=0;{let d=new Date();for(;;){if(days.includes(dkey(d))){streak++;d.setDate(d.getDate()-1)}else if(streak==0&&dkey(d)==dkey(Date.now())){d.setDate(d.getDate()-1)}else break}}
 const lab=days.map(d=>d.slice(8)+"/"+d.slice(5,7));
 const ser=Object.entries(CC).map(([c,[n,col]])=>({n,c:col,v:days.map(d=>{const a=P.filter(e=>dkey(e.t)==d).map(e=>partsOf(e)[c]).filter(v=>v!=null);return a.length?Math.round(mean(a)):null})}));
 const cards=Object.entries(CC).map(([c,[n,col]])=>{const a=P.map(e=>partsOf(e)[c]).filter(v=>v!=null),now=a.length?Math.round(mean(a.slice(-5))):null;
  return`<div class="sk" style="cursor:default;border-left:6px solid ${col}"><div style="flex:1"><h3>${n}</h3><div style="font-size:28px;font-weight:900;color:${col}">${now??"–"} <span style="font-size:13px;color:#777">${now?lvl(now):""}</span></div><div style="font-size:13px">${trend(a)} · ${a.length} latihan</div></div></div>`}).join("");
 const best=Object.entries(CC).map(([c,[n]])=>[n,mean(P.map(e=>partsOf(e)[c]).filter(v=>v!=null).slice(-5))]).filter(x=>x[1]);best.sort((a,b)=>a[1]-b[1]);
 const rows=SK.map(s=>{const a=P.filter(e=>e.k==s.k).map(e=>e.s);if(!a.length)return"";return`<tr><td>${s.ic} ${s.n}</td><td>${a.length}×</td><td>${a[0]}</td><td>${a[a.length-1]}</td><td>${Math.max(...a)}</td><td>${trend(a)}</td></tr>`}).join("");
 app.innerHTML=`<span class="back" onclick="home()">← Kembali</span><h1>📈 Progres Saya</h1>
 <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">${[["Total sesi",H.length],["Waktu latihan",fmtDur(H.reduce((x,e)=>x+(e.d||0),0))],["Hari beruntun",streak+" 🔥"]].map(([a,b])=>`<div class="passage" style="text-align:center"><div class="note">${a}</div><div style="font-size:22px;font-weight:900">${b}</div></div>`).join("")}</div>
 ${detBlock(P)}<h2 style="margin-top:22px">Kemampuan saat ini</h2><p class="note">Rata-rata 5 latihan terakhir (skala 10–160). Tren = rata-rata latihan awal dibanding latihan terbaru.</p><div class="grid">${cards}</div>
 ${best.length>1?`<p class="passage" style="margin-top:14px">💪 Paling kuat: <b>${best[best.length-1][0]}</b> · 🎯 Perlu difokuskan: <b>${best[0][0]}</b></p>`:""}
 <h2 style="margin-top:22px">Skor harian per kemampuan</h2>${lineChart(ser.concat([{n:"Overall (kumulatif)",c:"#4b4b4b",v:days.map(d=>detScores(P.filter(e=>dkey(e.t)<=d)).overall)}]),lab)}<p class="note">Garis abu-abu = skor Overall proporsional dari semua latihan sampai hari itu.</p>
 ${F.length?`<h2 style="margin-top:22px">Riwayat Tes Lengkap</h2>${lineChart([{n:"Skor total",c:"#4b4b4b",v:F.map(e=>e.s)},...["Reading","Listening","Writing","Speaking"].map((n,i)=>({n,c:["#1cb0f6","#ce82ff","#ff9600","#58cc02"][i],v:F.map(e=>e.sub?.[n]??null)}))],F.map(e=>{const d=new Date(e.t);return d.getDate()+"/"+(d.getMonth()+1)}))}<p class="note">${F.length} tes · terakhir ${F[F.length-1].s} · ${trend(F.map(e=>e.s))}</p>`:`<p class="note" style="margin-top:16px">Kerjakan Tes Latihan Lengkap untuk melihat grafik skor total dan subskor.</p>`}
 <h2 style="margin-top:22px">Detail per tipe soal</h2><table><tr><th>Tipe</th><th>Latihan</th><th>Pertama</th><th>Terakhir</th><th>Terbaik</th><th>Tren</th></tr>${rows}</table>
 ${ioPanel()}<div class="row"><button class="btn sec" id="rst">Reset semua progres</button><button class="btn" onclick="home()">Lanjut latihan</button></div>`;
 bindIO();$("#rst").onclick=()=>{if($("#rst").dataset.c){resetAll()}else{$("#rst").dataset.c=1;$("#rst").textContent="Klik lagi untuk konfirmasi"}}}
// ===== full test =====
const FSEQ=["rs","fb","ct","lt","rs","fb","lt","wp","sp","rts","ir","il","ws","iw","ss","is"];
function fullPlan(j){const used={};return FSEQ.map(k=>{used[k]=(used[k]||0)+1;return[k,used[k]==1?100+j:j]})}
function fullMenu(){VIEW="full";stop();$("#prog").style.visibility="hidden";const F=store.get().full||[];
 app.innerHTML=`<span class="back" onclick="home()">← Kembali</span><h1>📋 Tes Latihan Lengkap</h1><p class="sub">50 paket tes lengkap. Setiap paket berisi ${FSEQ.length} soal dari semua tipe dengan urutan seperti tes asli (±45–60 menit). Skor dihitung dengan pembobotan DET.</p>
 <div class="sets">${[...Array(NFULL).keys()].map(j=>`<div class="set ${F[j]!=null&&F[j]>=0?"done":""}" onclick="fullTest(${j})">Tes ${j+1}<small>${F[j]!=null&&F[j]>=0?"✓ Skor "+F[j]:"Belum dikerjakan"}</small></div>`).join("")}</div>`}
async function fullTest(j){if(j==null)return fullMenu();VIEW="test";const plan=fullPlan(j),items=[];
 loadingScreen("Menyiapkan Tes Lengkap "+(j+1)+"...");
 for(let n=0;n<plan.length;n++){$("#ldn").textContent=`Memuat soal ${n+1}/${plan.length}${plan[n][1]>=NSTATIC&&plan[n][0]!="rs"?" (dibuat Claude bila belum ada)":""}`;
  try{items.push(await getItem(plan[n][0],plan[n][1]))}catch(e){app.innerHTML=`<span class="back" onclick="fullMenu()">← Kembali</span><h2>Tes ${j+1} belum bisa disiapkan</h2><p class="sub">${e&&e.code=="nosample"?"Sebagian soal tes ini dibuat oleh Claude saat pertama dibuka, tapi fitur Claude tidak tersedia di tampilan ini.":"Pembuatan soal gagal. Coba lagi."}</p><button class="btn" onclick="fullTest(${j})">Coba lagi</button>`;return}}
 T0=Date.now();let n=0;const res=[];$("#prog").style.visibility="visible";
 const step=()=>{$("#bar").style.width=(n/plan.length*100)+"%";if(n>=plan.length)return finish(res,j);run(plan[n][0],items[n],x=>{res.push(x);n++;step()})};step()}
function finish(res,FJ){stop();$("#bar").style.width="100%";
 const SK4=[["reading","Reading"],["listening","Listening"],["writing","Writing"],["speaking","Speaking"]];
 const ind={};SK4.forEach(([c])=>{const a=res.map(r=>r.parts&&r.parts[c]).filter(v=>v!=null);ind[c]=a.length?round5(a.reduce((x,y)=>x+y,0)/a.length):10});
 const INT=[["Literacy","Reading + Writing","reading","writing"],["Comprehension","Reading + Listening","reading","listening"],["Conversation","Listening + Speaking","listening","speaking"],["Production","Writing + Speaking","writing","speaking"]].map(([n,d,a,b])=>[n,d,round5((ind[a]+ind[b])/2)]);
 const est=round5(SK4.reduce((x,[c])=>x+ind[c],0)/4);
 if(FJ!=null){const P=store.get();P.full=P.full||[];P.full[FJ]=Math.max(P.full[FJ]??-1,est);store.set(P)}hist.add({t:Date.now(),full:1,fj:FJ,s:est,sub:Object.fromEntries(INT.map(z=>[z[0],z[2]]).concat(SK4.map(([c,n])=>[n,ind[c]]))),d:Math.round((Date.now()-T0)/1000)});
 const bar=([n,d,v])=>`<div style="margin:6px 0"><b>${n}</b> <span class="note">${d}</span><div class="pb"><div><i style="width:${(v-10)/150*100}%"></i></div><span>${v}</span></div></div>`;
 app.innerHTML=`<h1>Hasil Tes Latihan Lengkap${FJ!=null?" "+(FJ+1):""}</h1><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div style="text-align:center"><div class="note">Overall</div><div class="big">${est}</div><b>CEFR ≈ ${lvl(est)}</b></div>
 <div style="flex:1;min-width:260px"><p class="note" style="margin:0">Individual Subscores</p>${SK4.map(([c,n])=>bar([n,"",ind[c]])).join("")}</div></div>
 <h2 style="margin-top:16px">Integrated Subscores</h2>${INT.map(bar).join("")}
 <div class="passage" style="margin-top:12px;font-size:13px"><b>Cara pembobotan (mengikuti DET):</b> setiap soal masuk ke satu Individual Subscore (Reading, Listening, Writing, Speaking) — ringkasan Interactive Listening dihitung ke Listening (pilihan balasan) dan Writing (ringkasan). Setiap skor dirata-rata per kemampuan. Integrated Subscore = rata-rata dua Individual Subscore. Overall di sini = rata-rata 4 Individual Subscore (DET resmi memakai model statistik sendiri, jadi ini perkiraan). Semua skor dibulatkan ke kelipatan 5 pada skala 10–160.</div>
 <table><tr><th>Soal</th><th>Skor</th><th>Pembahasan</th></tr>${res.map(r=>`<tr><td>${r.n}<br><span class="note">${Object.keys(r.parts||{}).join(", ")}</span></td><td><b class="${r.band>=95?"ok":"no"}">${r.band}</b></td><td><details><summary>Lihat</summary>${detail(r)}</details></td></tr>`).join("")}</table>
 <div class="row"><button class="btn sec" onclick="home()">Beranda</button><button class="btn" onclick="fullMenu()">Paket tes lain</button></div>`}
home();initCloud();
</script></body></html>
