<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan DET (Tidak Resmi) — Persiapan Akademik S2</title>
  <!-- Google Fonts: Nunito untuk tampilan bergaya Duolingo modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --g: #58cc02;
      --gd: #46a302;
      --b: #1cb0f6;
      --bd2: #1899d6;
      --bl: #ddf4ff;
      --r: #ff4b4b;
      --o: #ff9600;
      --p: #ce82ff;
      --t: #4b4b4b;
      --m: #afafaf;
      --bg: #ffffff;
      --bd: #e5e5e5;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--t);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header sticky */
    header {
      border-bottom: 2px solid var(--bd);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      z-index: 30;
    }

    .brand {
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      user-select: none;
    }

    .brand:hover {
      opacity: 0.85;
    }

    #prog {
      flex: 1;
      height: 14px;
      background: var(--bd);
      border-radius: 999px;
      overflow: hidden;
      visibility: hidden;
      min-width: 60px;
    }

    #bar {
      height: 100%;
      width: 0%;
      background: var(--g);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    #timer {
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
      display: none;
    }

    #timer.low {
      color: var(--r);
    }

    main {
      max-width: 760px;
      margin: 22px auto;
      padding: 0 16px 48px;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      margin: 8px 0 14px;
      line-height: 1.25;
    }

    h2 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px;
      line-height: 1.3;
    }

    .sub {
      color: #777777;
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.5;
    }

    .note {
      font-size: 13px;
      color: #777777;
      line-height: 1.5;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--bd);
      margin-bottom: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 10px;
      font-weight: 800;
      font-size: 13px;
      color: var(--m);
      cursor: pointer;
      letter-spacing: 0.6px;
      white-space: nowrap;
      transition: color 0.15s ease;
      user-select: none;
    }

    .tab:hover {
      color: var(--t);
    }

    .tab.on {
      color: var(--b);
      box-shadow: inset 0 -3px 0 var(--b);
    }

    /* Grids & Cards */
    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 580px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
      .grid3 {
        grid-template-columns: 1fr;
      }
    }

    .sk {
      border: 2px solid var(--bd);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      background: #ffffff;
      transition: background 0.15s ease, transform 0.12s ease, border-color 0.15s ease;
    }

    .sk:hover {
      background: #f9fafb;
      border-color: #d4d4d4;
    }

    .sk:active {
      transform: translateY(1px);
    }

    .ic {
      font-size: 32px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #f7f7f7;
      flex-shrink: 0;
    }

    .sk h3 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 800;
    }

    /* Progress bars */
    .pb {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pb > div {
      flex: 1;
      height: 10px;
      background: var(--bd);
      border-radius: 999px;
      overflow: hidden;
    }

    .pb i {
      display: block;
      height: 100%;
      background: var(--g);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .pb span {
      font-size: 13px;
      color: var(--m);
      font-weight: 800;
      white-space: nowrap;
    }

    /* Hero Banner */
    .full {
      background: linear-gradient(135deg, #1cb0f6 0%, #24c287 55%, #58cc02 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 4px 14px rgba(28, 176, 246, 0.18);
    }

    .full h2 {
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      margin: 0 0 4px;
    }

    .full p {
      margin: 0;
      opacity: 0.95;
      font-size: 14px;
      font-weight: 600;
    }

    /* Buttons bergaya Duolingo 3D */
    .btn {
      background: var(--g);
      color: #ffffff;
      border: 0;
      border-bottom: 4px solid var(--gd);
      border-radius: 14px;
      padding: 12px 22px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease, filter 0.15s ease;
      min-height: 44px;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.04);
    }

    .btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn.sec {
      background: #ffffff;
      color: var(--b);
      border: 2px solid var(--bd);
      border-bottom-width: 4px;
    }

    .btn.sec:hover:not(:disabled) {
      background: #f7f7f7;
    }

    .btn.wh {
      background: #ffffff;
      color: var(--b);
      border-bottom: 4px solid #dce6ec;
      padding: 12px 26px;
    }

    .btn.blue {
      background: var(--b);
      color: #ffffff;
      border-bottom-color: var(--bd2);
    }

    .btn.danger {
      background: #ffffff;
      color: var(--r);
      border: 2px solid #ffd4d4;
      border-bottom-width: 4px;
    }

    .btn.sm {
      padding: 7px 14px;
      font-size: 12px;
      min-height: 36px;
      border-radius: 10px;
    }

    /* Daftar paket */
    .sets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      gap: 10px;
    }

    .set {
      border: 2px solid var(--bd);
      border-bottom-width: 4px;
      border-radius: 14px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      background: #ffffff;
      transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
    }

    .set:hover {
      border-color: var(--b);
      background: #f5fbff;
    }

    .set:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .set.done {
      border-color: var(--g);
      background: #f1fbe8;
    }

    .set.ai-set {
      border-color: #ce82ff;
      background: #faf5ff;
    }

    .set small {
      display: block;
      color: #777777;
      font-weight: 700;
      font-size: 12px;
      margin-top: 4px;
    }

    /* Kartu soal */
    .qcard {
      border: 2px solid var(--bd);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .qhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 2px solid var(--bd);
      font-size: 14px;
      flex-wrap: wrap;
    }

    .qhead b {
      font-size: 16px;
    }

    .qx {
      cursor: pointer;
      color: #afafaf;
      font-size: 16px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
      user-select: none;
    }

    .qx:hover {
      background: #f3f4f6;
      color: var(--r);
    }

    .qbody {
      padding: 22px 20px;
      min-height: 260px;
    }

    .qfoot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-top: 2px solid var(--bd);
      background: #fafafa;
      flex-wrap: wrap;
    }

    /* Input & Textarea */
    input.t, textarea {
      width: 100%;
      border: 2px solid var(--bd);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 16px;
      background: #f9fafb;
      color: var(--t);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    input.t:focus, textarea:focus {
      border-color: var(--b);
      background: #ffffff;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.6;
    }

    /* Kotak huruf ala DET */
    .ctest {
      line-height: 2.75;
      font-size: 17px;
    }

    .lb {
      display: inline-flex;
      gap: 2px;
      vertical-align: middle;
    }

    .lb input {
      width: 1.45em;
      height: 1.85em;
      text-align: center;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      padding: 0;
      background: #f7f7f7;
      color: var(--t);
      outline: none;
      transition: border-color 0.12s ease, background 0.12s ease;
    }

    .lb input:focus {
      border-color: var(--b);
      background: var(--bl);
    }

    .lbpre {
      display: inline-flex;
      gap: 2px;
      vertical-align: middle;
      margin-right: 2px;
    }

    .lbpre i {
      font-style: normal;
      width: 1.45em;
      height: 1.85em;
      line-height: 1.85em;
      text-align: center;
      border: 1.5px solid #ececec;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      background: #ffffff;
      color: var(--t);
    }

    /* Read and Select buttons */
    .yn {
      width: 128px;
      height: 124px;
      border: 2px solid var(--bd);
      border-bottom-width: 5px;
      border-radius: 16px;
      background: #ffffff;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      color: var(--t);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .yn:hover {
      border-color: var(--b);
      background: #f5fbff;
    }

    .yn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    /* Speaker button */
    .spk {
      width: 92px;
      height: 92px;
      border: 0;
      border-radius: 20px;
      background: var(--b);
      color: #ffffff;
      font-size: 40px;
      cursor: pointer;
      border-bottom: 5px solid var(--bd2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    .spk:hover {
      filter: brightness(1.06);
    }

    .spk:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    /* Passage & Scene boxes */
    .passage {
      background: #f7f7f7;
      border-radius: 14px;
      padding: 16px;
      line-height: 1.8;
      font-size: 15.5px;
    }

    .scene {
      border-radius: 16px;
      padding: 24px 18px;
      text-align: center;
      border: 2px solid #cbeeff;
      background: linear-gradient(145deg, #e7f6ff 0%, #f3fbff 100%);
    }

    .scene-emoji {
      font-size: 56px;
      letter-spacing: 8px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .scene-cap {
      font-size: 14px;
      color: #4b5563;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.78);
      padding: 8px 12px;
      border-radius: 10px;
      display: inline-block;
    }

    /* Two column layout */
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 640px) {
      .two {
        grid-template-columns: 1fr;
      }
    }

    .two textarea {
      min-height: 200px;
    }

    /* Interactive reading blanks & dropdowns */
    .blank {
      display: inline-block;
      min-width: 90px;
      border: 1.5px solid #d1d5db;
      background: #ffffff;
      border-radius: 8px;
      padding: 1px 8px;
      margin: 0 2px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--bd2);
      transition: border-color 0.15s ease;
    }

    .blank.filled {
      border-color: var(--b);
      background: var(--bl);
    }

    .blank b {
      display: inline-block;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 0 4px;
      font-size: 11px;
      color: #64748b;
      margin-right: 4px;
      background: #ffffff;
    }

    .sel {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 7px 0;
    }

    .sel select {
      flex: 1;
      padding: 9px 10px;
      border: 2px solid var(--bd);
      border-radius: 10px;
      font: inherit;
      font-size: 14.5px;
      font-weight: 700;
      background: #ffffff;
      color: var(--t);
      cursor: pointer;
      outline: none;
    }

    .sel select:focus {
      border-color: var(--b);
    }

    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #6b7280;
      background: #ffffff;
    }

    /* Options & Chat bubbles */
    .opt {
      display: block;
      border: 2px solid var(--bd);
      border-bottom-width: 4px;
      border-radius: 12px;
      padding: 11px 14px;
      margin: 8px 0;
      cursor: pointer;
      font-weight: 700;
      font-size: 14.5px;
      background: #ffffff;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .opt:hover {
      background: #f9fafb;
    }

    .opt.on {
      border-color: var(--b);
      background: var(--bl);
      color: #0e6f9e;
    }

    .bubble {
      background: #f3f4f6;
      border-radius: 14px;
      padding: 12px 14px;
      margin: 8px 0;
      max-width: 88%;
      font-size: 15px;
      line-height: 1.5;
    }

    .bubble.me {
      background: var(--bl);
      color: #0e6f9e;
      margin-left: auto;
      font-weight: 700;
    }

    /* Misc utility */
    .tag {
      display: inline-block;
      background: var(--bl);
      color: var(--bd2);
      font-weight: 800;
      font-size: 12px;
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .big {
      font-size: 54px;
      font-weight: 900;
      color: var(--g);
      line-height: 1.1;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .back {
      color: var(--b);
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .ok {
      color: var(--gd);
      font-weight: 800;
    }

    .no {
      color: var(--r);
      font-weight: 800;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    td, th {
      padding: 9px 8px;
      border-bottom: 1px solid var(--bd);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      font-weight: 800;
      color: #374151;
    }

    .tbl-wrap {
      width: 100%;
      overflow-x: auto;
    }

    ul.pts {
      margin: 8px 0 0 20px;
      padding: 0;
      list-style: disc;
    }

    ul.pts li {
      margin: 4px 0;
    }

    details {
      margin-top: 10px;
    }

    summary {
      cursor: pointer;
      color: var(--b);
      font-weight: 800;
    }

    /* Toast & Modal */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: #2b2b2b;
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      z-index: 60;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      max-width: 92vw;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 18px;
      border: 2px solid var(--bd);
      max-width: 520px;
      width: 100%;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    /* Animasi denyut rekaman */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .rec-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--r);
      animation: pulseDot 1.1s infinite;
      margin-right: 4px;
    }

    /* Spinner kecil */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .spin.dark {
      border-color: rgba(28, 176, 246, 0.25);
      border-top-color: var(--b);
    }
  </style>
</head>
<body>
  <!-- Sticky Header -->
  <header>
    <div class="brand" id="homeBtn" title="Kembali ke Beranda">🦉 <span>Latihan DET</span></div>
    <div id="prog"><div id="bar"></div></div>
    <span id="sync" class="note" style="white-space:nowrap;font-weight:700"></span>
    <div id="timer"></div>
  </header>

  <!-- Konten Utama -->
  <main id="app"></main>

  <!-- Toast Notifikasi & Wadah Modal -->
  <div id="toast"></div>
  <div id="modalRoot"></div>

  <script type="module">
    // =========================================================================
    // 1. IMPORT FIREBASE (Cloud Sync dengan aturan jalur ketat & Auth dulu)
    // =========================================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDocs, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // =========================================================================
    // 2. BANK SOAL AKADEMIK S2 (15 PAKET UNIK PER TIPE SOAL, TANPA DUPLIKASI)
    // =========================================================================
    const BASE_NP = 15;

    // 2.1 Read and Select: 15 paket x 9 kata asli = 135 kata akademik S2 unik
    const RS_REAL = [

    function mergeProg(a, b) {
      const out = JSON.parse(JSON.stringify(a || {}));
      for (const k in (b || {})) {
        out[k] = out[k] || [];
        (b[k] || []).forEach((v, i) => {
          if (v != null) out[k][i] = Math.max(out[k][i] ?? -1, v);
        });
      }
      return out;
    }

      setSync("load");

        if (typeof __firebase_config === "undefined" || !__firebase_config) {

        const cfg = typeof __firebase_config === "string" ? JSON.parse(__firebase_config) : __firebase_config;

        // RULE 3: Auth dulu sebelum query Firestore
        if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
          const cred = await signInWithCustomToken(fbAuth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(fbAuth);
          currentUser = cred.user;
        }

        if (!currentUser) {
          setSync("local");
          return;
        }

        // RULE 2: Simple collection query tanpa orderBy/where/limit + error callback wajib
        unsubSnap = onSnapshot(
          userColRef(),
          (snap) => {
            let remoteProg = {};
            let remoteCustom = {};
            let remoteHist = [];
            snap.forEach((d) => {
              const v = d.data() || {};
              if (d.id === "state") {
                try { remoteProg = v.progJson ? JSON.parse(v.progJson) : (v.p || {}); } catch (e) {}
                try { remoteCustom = v.customSetsJson ? JSON.parse(v.customSetsJson) : {}; } catch (e) {}
              } else if (d.id.startsWith("h-")) {
                try {
                  const arr = v.itemsJson ? JSON.parse(v.itemsJson) : (v.items || []);
                  if (Array.isArray(arr)) remoteHist.push(...arr);
                } catch (e) {}
              }
            });

            // Gabungkan riwayat tanpa duplikasi
            const seen = new Set(remoteHist.map((e) => e.t + "|" + (e.k || "full")));
            const localOnly = MEM.hist.filter((e) => !seen.has(e.t + "|" + (e.k || "full")));
            MEM.hist = remoteHist.concat(localOnly).sort((a, b) => a.t - b.t);
            MEM.prog = mergeProg(remoteProg, MEM.prog);

            // Gabungkan custom sets
            for (const k in remoteCustom) {
              const rArr = remoteCustom[k] || [];
              const lArr = MEM.customSets[k] || [];
              MEM.customSets[k] = rArr.length >= lArr.length ? rArr : lArr;
            }

            setSync("cloud");
            if (VIEW === "home") home();
            else if (VIEW === "progress") progress();
          },
          () => {
            setSync("err");
          }
        );
      } catch (e) {
        fbDb = null;
        currentUser = null;
        setSync("local");
      }
    }

    // =========================================================================
    // 4. UTILITAS UMUM, AUDIO TTS, DAN WEB SPEECH API (DIKTE OTOMATIS)
    // =========================================================================
    function rng(s) {
      return () => {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    function shuffle(a, r = Math.random) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function norm(s) {
      return String(s || "").toLowerCase().replace(/[^a-z0-9' ]/g, "").replace(/\s+/g, " ").trim();
    }

    function wc(s) {
      s = String(s || "").trim();
      return s ? s.split(/\s+/).length : 0;
    }

    function once(fn) {
      let done = false;
      return (...args) => {
        if (!done) {
          done = true;
          return fn(...args);
        }
      };
    }

    const round5 = (v) => Math.max(10, Math.min(160, Math.round(v / 5) * 5));
    const band = (p) => round5(10 + Math.max(0, Math.min(1, p)) * 150);
    const lvl = (s) => (s >= 140 ? "C2" : s >= 120 ? "C1" : s >= 95 ? "B2" : s >= 65 ? "B1" : s >= 40 ? "A2" : "A1");
    const catOf = (k) => SK.find((s) => s.k === k).c[0];
    const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

      const el = $("#timer");
      const ql = $("#ql");

      const tick = () => {

        if (el) {
          el.textContent = txt;
          el.className = t <= 10 ? "low" : "";
        }
        const qt = $("#qt");

          onEnd();

    function stop() {

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const REC = {
      rec: null,
      buf: "",
      part: "",
      on: false,

    function recUI() {
      const e = $("#tr");
      if (e) {
        const html = (esc(REC.buf) + (REC.part ? ` <i style="color:#9ca3af">${esc(REC.part)}</i>` : "")).trim();
        e.innerHTML = html || "<span class='note'>(Menunggu suara bahasa Inggris... bicara dengan jelas dekat mikrofon)</span>";
      }
      const wcn = $("#wcn");

        const cur = REC.manual && $("#trt") ? $("#trt").value : (REC.buf + " " + REC.part);

    function setRecStatus(html) {
      const st = $("#recst");
      if (st) st.innerHTML = html;
    }

    function enableManualFallback(reason) {
      REC.manual = true;
      recStopImmediate();
      const box = $("#trbox");
      if (box) box.style.display = "block";
      const mw = $("#trManualWrap");
      if (mw) mw.style.display = "block";
      const trt = $("#trt");
      if (trt) {
        if (!trt.value && REC.buf) trt.value = REC.buf;
        trt.oninput = () => recUI();
        trt.focus();
      }
      setRecStatus(reason ? `<span class="no">${esc(reason)}</span>` : "⌨️ Mode ketik manual");
    }

    function recStopImmediate() {
      REC.on = false;
      if (REC.rec) {
        try {
          REC.rec.onend = null;
          REC.rec.onerror = null;
          REC.rec.onresult = null;
          REC.rec.stop();
        } catch (e) {}
        REC.rec = null;
      }
    }

    function startSpeechRecognition() {
      if (!SpeechRec) {
        enableManualFallback("Browser tidak mendukung Web Speech API.");
        return;
      }
      recStopImmediate();
      REC.manual = false;
      const mw = $("#trManualWrap");
      if (mw) mw.style.display = "none";

      try {
        const r = new SpeechRec();
        r.lang = "en-US";
        r.continuous = true;
        r.interimResults = true;

        r.onstart = () => {
          REC.on = true;
          setRecStatus(`<span class="rec-dot"></span><b style="color:var(--r)">Merekam suara...</b>`);
        };

        r.onresult = (ev) => {
          let interim = "";
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const transcript = ev.results[i][0].transcript;
            if (ev.results[i].isFinal) {
              REC.buf += (REC.buf ? " " : "") + transcript.trim();
            } else {
              interim += transcript;
            }
          }
          REC.part = interim.trim();
          recUI();
        };

        r.onerror = (ev) => {
          if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
            enableManualFallback("Izin mikrofon ditolak — beralih ke ketik manual.");
          } else if (ev.error === "audio-capture") {
            enableManualFallback("Mikrofon tidak terdeteksi — beralih ke ketik manual.");
          } else if (ev.error !== "no-speech" && ev.error !== "aborted") {
            setRecStatus(`<span class="note">⚠️ ${esc(ev.error)}</span>`);
          }
        };

        r.onend = () => {
          // Otomatis lanjutkan rekaman jika sesi masih aktif
          if (REC.on && !REC.manual) {
            try {
              r.start();
            } catch (e) {
              setRecStatus("⏹️ Berhenti — klik Mulai Mikrofon");
            }
          } else {
            setRecStatus("⏹️ Rekaman selesai");
          }
        };

        REC.rec = r;
        REC.on = true;
        r.start();
      } catch (e) {
        enableManualFallback("Tidak dapat memulai mikrofon.");
      }
    }

    function recBegin() {
      REC.buf = "";
      REC.part = "";
      REC.manual = false;
      const box = $("#trbox");
      if (box) box.style.display = "block";
      recUI();

      const btnR = $("#btnRecRestart");
      if (btnR) {
        btnR.onclick = () => {
          REC.buf = "";
          REC.part = "";
          recUI();
          startSpeechRecognition();
        };
      }
      const btnM = $("#btnRecManual");
      if (btnM) {
        btnM.onclick = () => enableManualFallback("Mode ketik manual dipilih.");
      }

      startSpeechRecognition();
    }

    async function getTranscript() {
      const trt = $("#trt");
      if (REC.manual && trt) {
        recStopImmediate();
        return trt.value.trim();
      }
      recStopImmediate();
      await new Promise((r) => setTimeout(r, 150));
      return (REC.buf + (REC.part ? " " + REC.part : "")).trim();
    }

    // =========================================================================
    // 5. INTEGRASI GEMINI API (PENILAIAN AI & GENERATOR PAKET BARU)
    // =========================================================================
    async function fetchGeminiJSON(prompt, responseSchema, retries = 3) {
      const apiKey = ""; // Disediakan otomatis oleh runtime
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema
        }
      };

      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const resp = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!resp.ok) {
            if ((resp.status === 429 || resp.status >= 500) && attempt < retries) {
              await new Promise((r) => setTimeout(r, 1000 * Math.pow(2, attempt)));
              continue;
            }
            throw new Error("HTTP " + resp.status);
          }
          const result = await resp.json();
          const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) throw new Error("Empty response");
          return JSON.parse(text);
        } catch (err) {
          if (attempt < retries) {
            await new Promise((r) => setTimeout(r, 1000 * Math.pow(2, attempt)));
          } else {
            throw err;
          }
        }
      }
    }

    // =========================================================================
    // 6. PENGAMBILAN ITEM PAKET (BAWAAN + CUSTOM AI)
    // =========================================================================
    function totalPackets(k) {
      return BASE_NP + ((MEM.customSets[k] || []).length);
    }

    function item(k, i) {
      // Jika indeks >= BASE_NP, ambil dari paket buatan AI
      if (i >= BASE_NP) {
        const custom = (MEM.customSets[k] || [])[i - BASE_NP];
        if (custom) return custom;
      }
      const r = rng(i * 131 + 17);
      if (k === "rs") {
        const re = RS_REAL.slice(i * 9, i * 9 + 9);
        const fk = RS_FAKE.slice(i * 9, i * 9 + 9);
        return { words: shuffle(re.concat(fk), r), real: re };
      }
      if (k === "fb") return [0, 1, 2].map((j) => [FBS[i * 3 + j].s, FBS[i * 3 + j].a]);
      if (k === "lt") return [LTS[i * 2], LTS[i * 2 + 1]];
      if (k === "ct") return CT_PASS[i];
      if (k === "ir") return IR_DATA[i];
      if (k === "wp") return WP_SCENES[i];
      if (k === "sp") return SP_SCENES[i];
      if (k === "rts") return RTSQ[i];
      if (k === "ws") return WSQ[i];
      if (k === "ss") return SSQ[i];
      if (k === "iw") return IWQ[i];
      if (k === "is") return ISQS[i];
      if (k === "il") {
        const d = DIALOG[i];
        return {
          ctx: d.ctx,
          t: d.t.map((turn) => ({ s: turn.s, o: turn.o, a: 0 })),
          sum: "Tulis ringkasan percakapan dalam bahasa Inggris: siapa yang terlibat, tujuan utama, dan hasil akhirnya."
        };
      }
    }

    // Generator Paket Akademik Baru (AI) menggunakan Gemini
    async function generateNewAIPacket(k) {
      const skObj = SK.find((s) => s.k === k);
      const btn = $("#btnGenAI");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="spin dark"></span> Membuat paket akademik baru...`;
      }

      try {
        let prompt = "";
        let schema = null;

        if (k === "rs") {
          prompt = `Generate ONE new Duolingo English Test 'Read and Select' academic graduate-level (S2) set: 9 real advanced academic English words (not basic words, distinct from abstract/epistemology/paradigm/mitigate) and 9 plausible English-looking academic pseudo-words (fake words that do NOT exist in English dictionaries). Return JSON with arrays 'real' (9 strings, lowercase) and 'fake' (9 strings, lowercase).`;
          schema = {
            type: "OBJECT",
            properties: {
              real: { type: "ARRAY", items: { type: "STRING" } },
              fake: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["real", "fake"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          const real = (res.real || []).slice(0, 9).map((w) => w.toLowerCase().trim());
          const fake = (res.fake || []).slice(0, 9).map((w) => w.toLowerCase().trim());
          if (real.length < 5 || fake.length < 5) throw new Error("Data kurang");
          saveCustomSet(k, { words: shuffle(real.concat(fake)), real });
        } else if (k === "fb") {
          prompt = `Generate 3 unique graduate-level academic research sentences for DET 'Fill in the Blanks'. Each item has 's' (English sentence with exactly one '___' placeholder) and 'a' (the single lowercase English target word, 5-12 letters, no spaces).`;
          schema = {
            type: "OBJECT",
            properties: {
              items: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: { s: { type: "STRING" }, a: { type: "STRING" } },
                  required: ["s", "a"]
                }
              }
            },
            required: ["items"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          const arr = (res.items || []).slice(0, 3).map((x) => [x.s, x.a.toLowerCase().trim()]);
          if (arr.length < 3) throw new Error("Data kurang");
          saveCustomSet(k, arr);
        } else if (k === "ct") {
          prompt = `Write ONE original academic English passage (4 sentences, ~75 words, graduate-level topic like epistemology, macroeconomics, immunology, or urban sociology) for DET 'Read and Complete'. Return JSON with 't' (concise title) and 'p' (paragraph).`;
          schema = {
            type: "OBJECT",
            properties: { t: { type: "STRING" }, p: { type: "STRING" } },
            required: ["t", "p"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          saveCustomSet(k, { t: res.t, p: res.p });
        } else if (k === "ir") {
          prompt = `Create ONE challenging graduate-level DET 'Interactive Reading' passage (~100 words) with exactly 6 numbered blanks written as {0}, {1}, {2}, {3}, {4}, {5}. For each blank, provide 5 English word choices in 'b' where index 0 is the exact correct word and indices 1..4 are 4 distractors that share the EXACT SAME part of speech and morphological inflection (e.g., all past-tense -ed verbs, all plural nouns, all adverbs -ly, or all base verbs) so all 5 are grammatically plausible. Also provide 'q' ("Which title best fits the passage?") and 'o' (4 title options where index 0 is the best title).`;
          schema = {
            type: "OBJECT",
            properties: {
              p: { type: "STRING" },
              b: { type: "ARRAY", items: { type: "ARRAY", items: { type: "STRING" } } },
              q: { type: "STRING" },
              o: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["p", "b", "q", "o"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          if (!res.b || res.b.length < 6) throw new Error("Blank kurang");
          saveCustomSet(k, res);
        } else if (k === "lt") {
          prompt = `Generate 2 distinct graduate-level academic English sentences (10-15 words each, natural academic syntax) for DET 'Listen and Type'.`;
          schema = {
            type: "OBJECT",
            properties: { sentences: { type: "ARRAY", items: { type: "STRING" } } },
            required: ["sentences"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          if (!res.sentences || res.sentences.length < 2) throw new Error("Kalimat kurang");
          saveCustomSet(k, res.sentences.slice(0, 2));
        } else if (k === "wp" || k === "sp") {
          prompt = `Create ONE academic/research visual scene for DET '${skObj.n}'. Provide 'emojis' (4 related emojis separated by spaces) and 'caption' (short scene description in Bahasa Indonesia about campus, research, conference, or graduate study).`;
          schema = {
            type: "OBJECT",
            properties: { emojis: { type: "STRING" }, caption: { type: "STRING" } },
            required: ["emojis", "caption"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          saveCustomSet(k, [res.emojis, res.caption]);
        } else if (k === "rts") {
          prompt = `Create ONE graduate-level DET 'Read, Then Speak' prompt: 'topic' (1 sentence instruction starting with 'Describe...') and 'points' (3 short bullet questions).`;
          schema = {
            type: "OBJECT",
            properties: {
              topic: { type: "STRING" },
              points: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["topic", "points"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          saveCustomSet(k, [res.topic, res.points.slice(0, 3)]);
        } else if (k === "ws" || k === "ss") {
          prompt = `Create ONE original graduate-level (S2) academic English prompt for DET '${skObj.n}' (2 sentences asking for reasoned discussion and examples).`;
          schema = {
            type: "OBJECT",
            properties: { promptText: { type: "STRING" } },
            required: ["promptText"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          saveCustomSet(k, res.promptText);
        } else if (k === "iw") {
          prompt = `Create ONE original graduate-level academic DET 'Interactive Writing' pair: 'main' (5-minute academic prompt) and 'followup' (3-minute specific follow-up question directly extending the main topic).`;
          schema = {
            type: "OBJECT",
            properties: { main: { type: "STRING" }, followup: { type: "STRING" } },
            required: ["main", "followup"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          saveCustomSet(k, [res.main, res.followup]);
        } else if (k === "is") {
          prompt = `Create ONE graduate-level DET 'Interactive Speaking' conversation set: 'theme' (short English academic theme) and 'questions' (3 progressive spoken questions in English).`;
          schema = {
            type: "OBJECT",
            properties: {
              theme: { type: "STRING" },
              questions: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["theme", "questions"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          saveCustomSet(k, [res.theme, res.questions.slice(0, 3)]);
        } else if (k === "il") {
          prompt = `Create ONE university graduate-campus scenario for DET 'Interactive Listening'. Include 'ctx' (short scenario description in Bahasa Indonesia) and 'turns' (array of 3 objects, each having 's': what the campus staff/professor says in English, and 'o': array of 4 English reply choices where index 0 is the best logical response and indices 1..3 are plausible but clearly wrong distractors).`;
          schema = {
            type: "OBJECT",
            properties: {
              ctx: { type: "STRING" },
              turns: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    s: { type: "STRING" },
                    o: { type: "ARRAY", items: { type: "STRING" } }
                  },
                  required: ["s", "o"]
                }
              }
            },
            required: ["ctx", "turns"]
          };
          const res = await fetchGeminiJSON(prompt, schema);
          saveCustomSet(k, {
            ctx: res.ctx,
            t: res.turns.slice(0, 3).map((x) => ({ s: x.s, o: x.o.slice(0, 4), a: 0 })),
            sum: "Tulis ringkasan percakapan dalam bahasa Inggris: siapa yang terlibat, tujuan utama, dan hasil akhirnya."
          });
        }

        showToast(`Paket baru #${totalPackets(k)} berhasil dibuat oleh AI!`);
        skill(k);
      } catch (e) {
        showToast("Gagal membuat paket AI saat ini. Coba beberapa saat lagi.");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `✨ Buat Paket Akademik Baru (AI)`;
        }
      }
    }
